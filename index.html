<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>パズルRPG</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0f172a;
  color:white;
  font-family:sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:430px;
  height:100svh;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.screen{
  display:none;
  height:100%;
  flex-direction:column;
  gap:7px;
}

.screen.active{
  display:flex;
}

.title{
  text-align:center;
  font-size:26px;
  font-weight:900;
  color:#fff3ad;
  margin:6px 0;
}

button,select{
  border:0;
  border-radius:13px;
  padding:11px;
  font-size:16px;
  font-weight:900;
  background:#eef2ff;
  color:#111827;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  display:flex;
  gap:6px;
}

.row button{
  flex:1;
}

.card,.status{
  background:#111827;
  border-radius:14px;
  padding:9px;
}

.status{
  background:#020617;
  font-size:12px;
  line-height:1.5;
  color:#cbd5e1;
}

.list{
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.char-row{
  background:#1e293b;
  border-radius:10px;
  padding:8px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:2px solid transparent;
}

.enemy-area{
  display:flex;
  gap:7px;
  align-items:center;
}

.enemy{
  width:50px;
  height:50px;
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}

.enemy-info{
  flex:1;
  font-size:11px;
  color:#cbd5e1;
}

.enemy-name{
  font-size:17px;
  color:white;
  font-weight:900;
}

.hp-wrap{
  height:11px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
  margin:3px 0;
}

.enemy-hp-bar{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#bef264);
  width:100%;
}

.message{
  background:#020617;
  border-radius:11px;
  min-height:34px;
  padding:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:14px;
  font-weight:900;
  color:#fff3ad;
}

.party{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
}

.member{
  background:#1e293b;
  border-radius:9px;
  padding:2px;
  text-align:center;
  position:relative;
  border:2px solid transparent;
}

.member .icon{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
}

.member .name{
  font-size:8px;
}

.player{
  background:#111827;
  border-radius:11px;
  padding:6px;
}

.hp-text{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:900;
  margin-bottom:3px;
}

.player-hp-bar{
  height:11px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
}

.player-hp-inner{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ef4444,#f97316,#facc15);
}

.board-wrap{
  background:#1f2937;
  border-radius:16px;
  padding:5px;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.board{
  width:100%;
  aspect-ratio:6/5;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:4px;
}

.orb{
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(21px,8vw,34px);
  font-weight:900;
}

.fire{background:#ef4444;}
.water{background:#3b82f6;}
.wood{background:#22c55e;}
.light{background:#facc15;color:#111827;}
.dark{background:#9333ea;}
.heart{background:#ec4899;}

.combo-effect{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:42px;
  font-weight:900;
  color:#fff3ad;
  pointer-events:none;
  z-index:9999;
}

.border-fire{border-color:#ef4444!important}
.border-water{border-color:#3b82f6!important}
.border-wood{border-color:#22c55e!important}
.border-light{border-color:#facc15!important}
.border-dark{border-color:#9333ea!important}

</style>
</head>

<body>

<div class="game">

<section id="home" class="screen active">
  <div class="title">パズルRPG</div>

  <div class="status" id="homeStatus"></div>

  <div class="menu">
    <button onclick="showScreen('dungeonMenu')">
      ダンジョン
    </button>

    <button onclick="showScreen('charMenu')">
      キャラ
    </button>

    <button onclick="showScreen('gacha')">
      ガチャ
    </button>
  </div>
</section>

<section id="battle" class="screen">

  <div class="card">

    <div class="enemy-area">

      <div class="enemy wood" id="enemyIcon"></div>

      <div class="enemy-info">

        <div class="enemy-name" id="enemyName">
          モリスライム
        </div>

        <div>
          階層：
          <span id="floorText">1</span>
        </div>

        <div class="hp-wrap">
          <div class="enemy-hp-bar"
               id="enemyHpBar"></div>
        </div>

        <div>
          敵HP：
          <span id="enemyHpText">5000</span>
        </div>

      </div>
    </div>
  </div>

  <div class="message" id="message">
    ドロップを動かそう
  </div>

  <div class="party" id="party"></div>

  <div class="player">

    <div class="hp-text">

      <span>味方HP</span>

      <span>
        <span id="playerHpText">0</span>
        /
        <span id="playerMaxHpText">0</span>
      </span>

    </div>

    <div class="player-hp-bar">
      <div class="player-hp-inner"
           id="playerHpBar"></div>
    </div>

  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

</section>

<script>

const ROWS=5;
const COLS=6;

const TYPES=[
  "fire",
  "water",
  "wood",
  "light",
  "dark",
  "heart"
];

const ICONS={
  fire:"火",
  water:"水",
  wood:"木",
  light:"光",
  dark:"闇",
  heart:"♡"
};

const JP={
  fire:"火",
  water:"水",
  wood:"木",
  light:"光",
  dark:"闇",
  heart:"回復"
};

const $=id=>document.getElementById(id);

function char(
  no,
  name,
  rarity,
  attr,
  hp,
  atk,
  rcv,
  ls
){
  return{
    no,
    name,
    rarity,
    attr,
    hp,
    atk,
    rcv,
    ls,
    lv:1,
    skillLv:1
  };
}

const chars=[

char(
  42,
  "創世龍",
  6,
  "light",
  5200,
  980,
  520,
  "光属性のHP2.5倍、攻撃力2倍、回復力2倍、光を5個消しで攻撃力4倍、1コンボ加算"
),

char(
  43,
  "炎海神",
  6,
  "fire",
  3300,
  1650,
  110,
  "火属性のHP2.5倍、攻撃力2倍、回復力2倍、火を5個消しで攻撃力4倍、1コンボ加算"
),

char(
  44,
  "深森神",
  6,
  "wood",
  5600,
  820,
  360,
  "木属性のHP2.5倍、攻撃力2倍、回復力2倍、木を5個消しで攻撃力4倍、1コンボ加算"
),

char(
  45,
  "終焉神ノクス",
  6,
  "dark",
  4100,
  2100,
  0,
  "闇属性のHP2.5倍、攻撃力2倍、回復力2倍、闇を5個消しで攻撃力4倍、1コンボ加算"
),

char(
  46,
  "天導姫",
  6,
  "light",
  4800,
  1100,
  620,
  "光属性のHP2.5倍、攻撃力2倍、回復力2倍、光を5個消しで攻撃力4倍、1コンボ加算"
),

char(
  72,
  "紅蓮姫アカリ",
  5,
  "fire",
  3200,
  1120,
  180,
  "火ドロップ2コンボ以上で攻撃力3倍、1コンボ加算、ダメージ25%軽減"
),

char(
  73,
  "海竜王リヴァ",
  5,
  "water",
  5200,
  640,
  480,
  "水属性の攻撃力3倍、回復力1.5倍、3色消すとダメージ15%軽減"
),

char(
  74,
  "森羅姫ミドリ",
  5,
  "wood",
  4700,
  760,
  360,
  "木ドロップを4個消しすると木属性の攻撃力が2.5倍、ダメージ20%軽減"
),

char(
  75,
  "光翼神ルミナ",
  5,
  "light",
  4100,
  920,
  450,
  "光ドロップを十字消しで攻撃力3.5倍、ダメージ30%軽減"
),

char(
  76,
  "冥月神カゲロウ",
  5,
  "dark",
  3500,
  1350,
  60,
  "6コンボ以上で攻撃力上昇、最大7倍、操作時間1秒延長、ダメージ20%軽減"
)

];

let party=[
  chars[0],
  chars[1],
  chars[2],
  chars[3],
  chars[4],
  chars[0]
];

let board=[];

let playerMaxHp=0;
let playerHp=0;

let enemyHp=0;
let enemyMaxHp=0;

let enemyAtk=0;

let floor=1;

function attrBorder(attr){
  return "border-"+attr;
}

function updateHome(){

  $("homeStatus").innerHTML=
  `
  所持キャラ：${chars.length}体
  <br>
  現在編成：
  ${party[0].name}
  `;

}

function renderParty(){

  const el=$("party");

  el.innerHTML="";

  party.forEach((c,i)=>{

    const d=document.createElement("div");

    d.className=
      "member "+
      attrBorder(c.attr);

    d.innerHTML=
    `
    <div class="icon ${c.attr}">
      ${JP[c.attr]}
    </div>

    <div class="name">
      No.${c.no}
    </div>
    `;

    el.appendChild(d);

  });

}

function calcHp(){

  playerMaxHp=party.reduce(
    (s,c)=>s+c.hp,
    0
  );

  playerHp=playerMaxHp;

  $("playerHpText").textContent=
    playerHp;

  $("playerMaxHpText").textContent=
    playerMaxHp;

}

function setEnemy(){

  const scaleHp=
    1+(floor*0.13);

  const scaleAtk=
    1+(floor*0.08);

  enemyMaxHp=Math.floor(
    5000*scaleHp
  );

  enemyHp=enemyMaxHp;

  enemyAtk=Math.floor(
    850*scaleAtk
  );

  $("enemyHpText").textContent=
    enemyHp;

  $("enemyHpBar").style.width=
    "100%";

  $("floorText").textContent=
    floor;

}

function createBoard(){

  board=[];

  for(let r=0;r<ROWS;r++){

    const row=[];

    for(let c=0;c<COLS;c++){

      row.push(
        TYPES[
          Math.floor(
            Math.random()*TYPES.length
          )
        ]
      );

    }

    board.push(row);

  }

  renderBoard();

}

function renderBoard(){

  const el=$("board");

  el.innerHTML="";

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      const orb=document.createElement("div");

      orb.className=
        "orb "+
        board[r][c];

      orb.textContent=
        ICONS[board[r][c]];

      el.appendChild(orb);

    }

  }

}

updateHome();
renderParty();
calcHp();
setEnemy();
createBoard();

<script>

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(s=>{
      s.classList.remove("active");
    });

  $(id).classList.add("active");

  if(id==="home"){
    updateHome();
  }

  if(id==="battle"){
    renderParty();
    calcHp();
    setEnemy();
    createBoard();
  }

}

let dragging=false;
let selected=null;

function getCell(x,y){

  const rect=$("board")
    .getBoundingClientRect();

  const c=Math.floor(
    (x-rect.left) /
    (rect.width/COLS)
  );

  const r=Math.floor(
    (y-rect.top) /
    (rect.height/ROWS)
  );

  if(
    r<0 ||
    c<0 ||
    r>=ROWS ||
    c>=COLS
  ){
    return null;
  }

  return {r,c};

}

function swap(a,b){

  const t=board[a.r][a.c];

  board[a.r][a.c]=
    board[b.r][b.c];

  board[b.r][b.c]=t;

}

function near(a,b){

  return Math.abs(a.r-b.r)+
         Math.abs(a.c-b.c)===1;

}

$("board").addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    selected=getCell(
      e.clientX,
      e.clientY
    );

    if(!selected)return;

    dragging=true;

  }
);

window.addEventListener(
  "pointermove",
  e=>{

    if(!dragging||!selected)return;

    const cell=getCell(
      e.clientX,
      e.clientY
    );

    if(!cell)return;

    while(
      selected &&
      (
        selected.r!==cell.r ||
        selected.c!==cell.c
      )
    ){

      const dr=cell.r-selected.r;
      const dc=cell.c-selected.c;

      const sr=Math.sign(dr);
      const sc=Math.sign(dc);

      let next=null;

      if(Math.abs(dc)>=Math.abs(dr)){
        if(sc){
          next={
            r:selected.r,
            c:selected.c+sc
          };
        }else if(sr){
          next={
            r:selected.r+sr,
            c:selected.c
          };
        }
      }else{
        if(sr){
          next={
            r:selected.r+sr,
            c:selected.c
          };
        }else if(sc){
          next={
            r:selected.r,
            c:selected.c+sc
          };
        }
      }

      if(!next||!near(selected,next))break;

      swap(selected,next);

      selected=next;

    }

    renderBoard();

  }
);

window.addEventListener(
  "pointerup",
  ()=>{

    if(!dragging)return;

    dragging=false;
    selected=null;

    resolveBoard();

  }
);

function getMatches(){

  const mark={};

  for(let r=0;r<ROWS;r++){

    let count=1;

    for(let c=1;c<=COLS;c++){

      if(
        c<COLS &&
        board[r][c] &&
        board[r][c]===board[r][c-1]
      ){

        count++;

      }else{

        if(count>=3){

          for(let k=0;k<count;k++){

            mark[
              r+","+(c-1-k)
            ]=true;

          }

        }

        count=1;

      }

    }

  }

  for(let c=0;c<COLS;c++){

    let count=1;

    for(let r=1;r<=ROWS;r++){

      if(
        r<ROWS &&
        board[r][c] &&
        board[r][c]===board[r-1][c]
      ){

        count++;

      }else{

        if(count>=3){

          for(let k=0;k<count;k++){

            mark[
              (r-1-k)+","+c
            ]=true;

          }

        }

        count=1;

      }

    }

  }

  return mark;

}

function getGroups(){

  const matched=getMatches();

  const visited={};

  const groups=[];

  const dirs=[
    [1,0],
    [-1,0],
    [0,1],
    [0,-1]
  ];

  Object.keys(matched)
    .forEach(key=>{

      if(visited[key])return;

      const [sr,sc]=key
        .split(",")
        .map(Number);

      const type=board[sr][sc];

      const stack=[
        {r:sr,c:sc}
      ];

      const cells=[];

      visited[key]=true;

      while(stack.length){

        const cur=stack.pop();

        cells.push(cur);

        dirs.forEach(([dr,dc])=>{

          const nr=cur.r+dr;
          const nc=cur.c+dc;
          const nk=nr+","+nc;

          if(
            nr<0 ||
            nc<0 ||
            nr>=ROWS ||
            nc>=COLS ||
            !matched[nk] ||
            visited[nk] ||
            board[nr][nc]!==type
          ){
            return;
          }

          visited[nk]=true;

          stack.push({
            r:nr,
            c:nc
          });

        });

      }

      groups.push({
        type,
        cells,
        count:cells.length
      });

    });

  return groups;

}

function sleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}

function showCombo(n){

  const e=document.createElement("div");

  e.className="combo-effect";

  e.textContent=n+"コンボ！";

  document.body.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    700
  );

}

async function resolveBoard(){

  let combo=0;

  let allGroups=[];

  while(true){

    const groups=getGroups();

    if(!groups.length)break;

    allGroups.push(...groups);

    for(const g of groups){

      combo++;

      showCombo(combo);

      g.cells.forEach(cell=>{

        board[cell.r][cell.c]=null;

      });

      renderBoard();

      await sleep(180);

    }

    dropOrbs();

    renderBoard();

    await sleep(180);

  }

  if(combo>0){

    healByHeart(allGroups);

    attack(combo,allGroups);

  }else{

    enemyAttack();

  }

}

function dropOrbs(){

  for(let c=0;c<COLS;c++){

    const remain=[];

    for(let r=ROWS-1;r>=0;r--){

      if(board[r][c]){
        remain.push(board[r][c]);
      }

    }

    while(remain.length<ROWS){

      remain.push(
        TYPES[
          Math.floor(
            Math.random()*TYPES.length
          )
        ]
      );

    }

    for(let r=ROWS-1;r>=0;r--){

      board[r][c]=
        remain[ROWS-1-r];

    }

  }

}

function healByHeart(groups){

  const hearts=groups.filter(
    g=>g.type==="heart"
  ).length;

  if(hearts<=0)return;

  const rcv=party.reduce(
    (s,c)=>s+c.rcv,
    0
  );

  const heal=Math.floor(
    rcv*hearts
  );

  playerHp=Math.min(
    playerMaxHp,
    playerHp+heal
  );

  $("playerHpText").textContent=
    playerHp;

  $("playerHpBar").style.width=
    (playerHp/playerMaxHp*100)+"%";

}

function usedTypes(groups){

  return new Set(
    groups
      .filter(g=>g.type!=="heart")
      .map(g=>g.type)
  );

}

function hasOrbCount(
  groups,
  type,
  count
){

  return groups.some(
    g=>
      g.type===type &&
      g.count>=count
  );

}

function leaderOneMultiplier(
  ls,
  combo,
  groups
){

  if(!ls)return 1;

  let mult=1;

  const strong=ls.match(
    /(火|水|木|光|闇)属性のHP2\.5倍、攻撃力2倍、回復力2倍、(火|水|木|光|闇)を5個消しで攻撃力4倍/
  );

  if(strong){

    const key={
      火:"fire",
      水:"water",
      木:"wood",
      光:"light",
      闇:"dark"
    }[strong[2]];

    mult*=2;

    if(hasOrbCount(groups,key,5)){
      mult*=4;
    }

    return mult;

  }

  if(ls.includes("全てのステータス2.5倍")){
    mult*=2.5;
  }

  if(ls.includes("攻撃力3倍")){
    mult*=3;
  }

  if(ls.includes("最大7倍")&&combo>=6){
    mult*=7;
  }

  return mult;

}

function leaderMultiplier(
  combo,
  groups
){

  return (
    leaderOneMultiplier(
      party[0].ls,
      combo,
      groups
    )
    *
    leaderOneMultiplier(
      party[5].ls,
      combo,
      groups
    )
  );

}

function attack(combo,groups){

  let atk=party.reduce(
    (s,c)=>s+c.atk,
    0
  );

  const leader=
    leaderMultiplier(
      combo,
      groups
    );

  let dmg=Math.floor(
    atk *
    leader *
    (1+(combo-1)*0.25)
  );

  enemyHp=Math.max(
    0,
    enemyHp-dmg
  );

  $("enemyHpText").textContent=
    enemyHp;

  $("enemyHpBar").style.width=
    (enemyHp/enemyMaxHp*100)+"%";

  $("message").textContent=
    combo+
    "コンボ！ "+
    dmg+
    "ダメージ！";

  if(enemyHp<=0){

    floor++;

    setTimeout(()=>{

      setEnemy();
      createBoard();

      $("message").textContent=
        "次の階層へ！";

    },700);

  }else{

    enemyAttack();

  }

}

function enemyAttack(){

  playerHp=Math.max(
    0,
    playerHp-enemyAtk
  );

  $("playerHpText").textContent=
    playerHp;

  $("playerHpBar").style.width=
    (playerHp/playerMaxHp*100)+"%";

  if(playerHp<=0){

    $("message").textContent=
      "ゲームオーバー…";

  }

}

</script>
</div>
</body>
