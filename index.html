<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>パズルRPG 安定版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;font-family:sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.game{width:100%;max-width:430px;height:100svh;padding:7px;display:flex;flex-direction:column;gap:6px}
.screen{display:none;height:100%;flex-direction:column;gap:7px}
.screen.active{display:flex}
.title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad;margin:6px 0}
button{border:0;border-radius:13px;padding:11px;font-size:16px;font-weight:900;background:#eef2ff;color:#111827}
.menu{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:6px}.row button{flex:1}
.card,.status{background:#111827;border-radius:14px;padding:9px}
.status{background:#020617;font-size:12px;line-height:1.5;color:#cbd5e1}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px}
.char-row,.drop-row{background:#1e293b;border-radius:10px;padding:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.enemy-area{display:flex;gap:7px;align-items:center}
.enemy{width:50px;height:50px;border-radius:50%;position:relative;flex-shrink:0}
.enemy.hit{animation:hit .2s}
@keyframes hit{50%{transform:scale(.82);filter:brightness(2)}}
.enemy-info{flex:1;font-size:11px;color:#cbd5e1;padding-right:54px}
.enemy-name{font-size:17px;color:white;font-weight:900}
.hp-wrap{height:11px;background:#020617;border-radius:999px;overflow:hidden;margin:3px 0}
.enemy-hp-bar{height:100%;background:linear-gradient(90deg,#22c55e,#bef264);width:100%;transition:.25s}
.top-retreat{position:absolute;right:7px;top:7px;padding:5px 9px;font-size:12px;border-radius:999px;background:#fee2e2;color:#991b1b}
.message{background:#020617;border-radius:11px;min-height:34px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:900;color:#fff3ad}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.member{background:#1e293b;border-radius:9px;padding:2px;text-align:center;position:relative}
.member.leader{outline:2px solid #facc15}
.member.friend{outline:2px solid #38bdf8}
.role{position:absolute;left:2px;top:2px;background:#020617;border-radius:5px;font-size:8px;padding:1px 3px;color:#fff3ad}
.member .atk{font-size:9px;color:#fde68a;font-weight:900}
.member .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.member .name{font-size:8px}
.player{background:#111827;border-radius:11px;padding:6px;position:relative}
.player.hit{animation:shake .25s}
.player.heal{animation:heal .25s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes heal{50%{filter:brightness(1.8)}}
.hp-text{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:3px}
.player-hp-bar{height:11px;background:#020617;border-radius:999px;overflow:hidden}
.player-hp-inner{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316,#facc15);transition:.25s}
.timer{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:900}
.timer-wrap{flex:1;height:8px;background:#020617;border-radius:999px;overflow:hidden}
.timer-bar{height:100%;width:100%;background:#38bdf8}
.board-wrap{background:#1f2937;border-radius:16px;padding:5px;flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.board{width:100%;height:auto;max-height:100%;aspect-ratio:6/5;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:4px}
.orb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(21px,8vw,34px);font-weight:900;transition:.07s}
.orb.held{opacity:.15;transform:scale(.9)}
.orb.clear{opacity:0;transform:scale(.1)}
.drag-orb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,36px);font-weight:900;pointer-events:none;z-index:100;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.float{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;pointer-events:none;animation:floatUp 1.6s forwards;text-shadow:0 2px 4px #000;z-index:50;white-space:nowrap}
.member .float{font-size:14px}
.damage{color:#ffe066}.healNum{color:#5dff9d}.hurt{color:#ff7b7b}
@keyframes floatUp{20%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-145%) scale(1)}}
.combo-effect{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fff3ad;text-shadow:0 0 12px #facc15,0 0 24px #f59e0b,0 4px 10px #000;pointer-events:none;z-index:9999;animation:comboAnim .9s forwards}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}}
.fire,.fire-bg{background:radial-gradient(circle at 30% 30%,#ffd4a8,#ef4444)}
.water,.water-bg{background:radial-gradient(circle at 30% 30%,#d7f1ff,#3b82f6)}
.wood,.wood-bg{background:radial-gradient(circle at 30% 30%,#e4ffd8,#22c55e)}
.light,.light-bg{background:radial-gradient(circle at 30% 30%,#fffad1,#facc15);color:#111827}
.dark,.dark-bg{background:radial-gradient(circle at 30% 30%,#f5d0fe,#9333ea)}
.heart{background:radial-gradient(circle at 30% 30%,#ffe4f0,#ec4899)}
.result-box{background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.result-title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad}
.result-item{background:#020617;border-radius:12px;padding:10px;font-size:15px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:99999;padding:18px}
.modal.active{display:flex}
.modal-box{width:100%;max-width:390px;background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.modal-title{font-size:20px;font-weight:900;color:#fff3ad}
.modal-text{font-size:13px;line-height:1.55;color:#e5e7eb;white-space:pre-wrap}
.gacha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gacha-card{background:#1e293b;border-radius:9px;padding:6px;text-align:center;font-size:11px}
.gacha-card .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;margin-bottom:2px}
.rare6{outline:2px solid #facc15}.rare5{outline:2px solid #c084fc}
</style>
</head>
<body>
<div class="game">

<section id="home" class="screen active">
  <div class="title">パズルRPG</div>
  <div class="status" id="homeStatus"></div>
  <div class="menu">
    <button onclick="showScreen('dungeonMenu')">ダンジョン</button>
    <button onclick="showScreen('charMenu')">キャラ</button>
    <button onclick="showScreen('gacha')">ガチャ</button>
  </div>
</section>

<section id="dungeonMenu" class="screen">
  <div class="title">ダンジョン</div>
  <div class="menu">
    <button onclick="startDungeon()">ノーマルダンジョン</button>
    <button onclick="showScreen('home')">戻る</button>
  </div>
</section>

<section id="charMenu" class="screen">
  <div class="title">キャラ</div>
  <div class="row">
    <button onclick="showScreen('home')">戻る</button>
    <button onclick="showScreen('formation')">編成</button>
  </div>
  <div class="list" id="charList"></div>
</section>

<section id="formation" class="screen">
  <div class="title">編成</div>
  <button onclick="showScreen('charMenu')">戻る</button>
  <div class="status">左端がリーダー、右端がフレンド。上の枠を押してから下のキャラを選ぶ。</div>
  <div class="party" id="formationSlots"></div>
  <div class="list" id="formationList"></div>
</section>

<section id="gacha" class="screen">
  <div class="title">ガチャ</div>
  <div class="status">石5個で1回 / 50個で10連<br>★2:40% ★3:38% ★4:15% ★5:5% ★6:2%<br>ガチャ石：<span id="gachaStoneText">0</span></div>
  <div class="row">
    <button onclick="doGacha(1)">1回</button>
    <button onclick="doGacha(10)">10連</button>
  </div>
  <div class="list" id="gachaResult"></div>
  <button onclick="showScreen('home')">戻る</button>
</section>

<section id="result" class="screen">
  <div class="result-box">
    <div class="result-title">ダンジョンクリア！</div>
    <div class="result-item" id="resultSummary"></div>
    <div class="menu">
      <button onclick="showScreen('home')">ホームへ</button>
      <button onclick="showScreen('dungeonMenu')">ダンジョンへ</button>
    </div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="card">
    <button class="top-retreat" onclick="retreatDungeon()">撤退</button>
    <div class="enemy-area">
      <div class="enemy wood-bg" id="enemyIcon"></div>
      <div class="enemy-info">
        <div class="enemy-name" id="enemyName">モリスライム</div>
        <div>階層：<span id="floorText">1</span>/5 / 攻撃：<span id="enemyAtkText">850</span></div>
        <div class="hp-wrap"><div class="enemy-hp-bar" id="enemyHpBar"></div></div>
        <div>敵HP：<span id="enemyHpText">5000</span>/<span id="enemyMaxHpText">5000</span></div>
      </div>
    </div>
  </div>

  <div class="message" id="message">ドロップを動かしたら操作開始</div>
  <div class="party" id="party"></div>

  <div class="player" id="playerArea">
    <div class="hp-text"><span>味方HP</span><span><span id="playerHpText">0</span>/<span id="playerMaxHpText">0</span></span></div>
    <div class="player-hp-bar"><div class="player-hp-inner" id="playerHpBar"></div></div>
  </div>

  <div class="timer">
    <span>操作 <span id="timerText">5.0</span>秒</span>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  </div>

  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
</section>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <div class="row" id="modalButtons"></div>
  </div>
</div>

<script>
if(location.search.includes("reset=1")){
  localStorage.removeItem("puzzleStableSave");
  location.href=location.pathname;
}

const ROWS=5,COLS=6,MOVE_TIME=5;
const TYPES=["fire","water","wood","light","dark","heart"];
const ICONS={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"♡"};
const JP={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"回復"};
const BG={fire:"fire-bg",water:"water-bg",wood:"wood-bg",light:"light-bg",dark:"dark-bg"};
const $=id=>document.getElementById(id);

function char(no,name,rarity,attr,hp,atk,rcv){
  return {no,name,rarity,attr,hp,atk,rcv,type:"battle",lv:1};
}

const baseChars=[
 char(1,"火の見習い",1,"fire",500,150,15),
 char(2,"水の守り手",1,"water",1500,50,45),
 char(3,"木の兵士",1,"wood",1000,100,30),
 char(4,"闇の爪",1,"dark",750,180,0),
 char(5,"光の癒し手",1,"light",1200,100,50),
 char(6,"火の助っ人",1,"fire",600,130,25)
];

const gachaChars=[
 char(19,"炎剣士",3,"fire",1100,320,60),
 char(20,"アクアメイジ",3,"water",2100,180,220),
 char(21,"森忍者",3,"wood",1800,230,140),
 char(22,"聖騎士",3,"light",2000,250,210),
 char(23,"ダークシャーマン",3,"dark",1600,420,20),
 char(27,"戦神兵",4,"fire",1900,520,80),
 char(28,"癒し巫女",4,"water",2900,220,340),
 char(33,"冥騎士",4,"dark",2100,700,0),
 char(37,"フェニックス",5,"fire",2600,980,140),
 char(38,"三界龍",5,"wood",4200,620,220),
 char(39,"聖魔神",5,"dark",3000,1250,40),
 char(42,"創世龍",6,"light",5200,980,520),
 char(43,"炎海神",6,"fire",3300,1650,110),
 char(45,"終焉神ノクス",6,"dark",4100,2100,0),
 char(47,"火山ゴブリン",2,"fire",850,210,25),
 char(50,"アクアスライム",2,"water",1600,120,140),
 char(53,"森スライム",2,"wood",1500,160,90),
 char(56,"ライトフェアリー",2,"light",1650,180,140),
 char(59,"ダークスライム",2,"dark",1200,320,0)
];

function freshSave(){
  return {
    money:0,
    stone:200,
    owned:baseChars.map(c=>({...c,count:1,lv:1})),
    partyNos:[1,2,3,4,5,6],
    clearedNormal:0
  };
}

let save;
try{
  save=JSON.parse(localStorage.getItem("puzzleStableSave")||"null")||freshSave();
  if(!Array.isArray(save.owned)||!Array.isArray(save.partyNos))throw new Error("bad save");
}catch(e){
  save=freshSave();
}
function saveData(){localStorage.setItem("puzzleStableSave",JSON.stringify(save));}

let selectedSlot=0;
let party=[];
let board=[];
let dragging=false,movedOnce=false,resolving=false,selected=null,timerId=null,dragGhost=null;
let playerMaxHp=0,playerHp=0,totalRcv=0;
let enemyHp=0,enemyMaxHp=0,enemyAtk=0,floorIndex=0;
let floors=[];

const boardEl=$("board"),boardWrap=$("boardWrap"),partyEl=$("party"),message=$("message");

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  updateHome();
  if(id==="charMenu")renderCharList();
  if(id==="formation")renderFormation();
  if(id==="gacha"){$("gachaStoneText").textContent=save.stone;$("gachaResult").innerHTML=""}
}

function updateHome(){
  $("homeStatus").innerHTML=`ゴールド：${save.money}<br>ガチャ石：${save.stone}<br>ノーマル到達：ダンジョン${save.clearedNormal+1}<br><small>動かない時はURL末尾に ?reset=1</small>`;
}

function stat(c,k){return Math.floor((c[k]||0)*(1+((c.lv||1)-1)*0.025));}
function getBattleOwned(){return save.owned.filter(c=>c.type==="battle");}
function getCharByNo(no){return getBattleOwned().find(c=>c.no===no)||baseChars.find(c=>c.no===no)||baseChars[0];}

function renderCharList(){
  const list=$("charList");list.innerHTML="";
  save.owned.forEach(c=>{
    const row=document.createElement("div");
    row.className="char-row";
    row.innerHTML=`<span>★${c.rarity} No.${c.no} ${c.name}<br>${JP[c.attr]} / Lv${c.lv||1}</span><span>×${c.count||1}</span>`;
    row.onclick=()=>showCharDetail(c);
    list.appendChild(row);
  });
}

function showCharDetail(c){
  modal(`No.${c.no} ${c.name}`,
`レア度：${c.rarity}
属性：${JP[c.attr]}
Lv：${c.lv||1}/100
HP：${stat(c,"hp")}
攻撃：${stat(c,"atk")}
回復：${stat(c,"rcv")}`,
[{label:"閉じる"}]);
}

function renderFormation(){
  const slots=$("formationSlots"),list=$("formationList");
  slots.innerHTML="";list.innerHTML="";
  save.partyNos.slice(0,6).forEach((no,i)=>{
    const c=getCharByNo(no);
    const d=document.createElement("div");
    d.className="member "+(i===0?"leader":i===5?"friend":"");
    if(i===selectedSlot)d.style.outline="3px solid #fff3ad";
    d.innerHTML=`<div class="role">${i===0?"L":i===5?"F":i+1}</div><div class="atk">攻 ${stat(c,"atk")}</div><div class="icon ${BG[c.attr]}">${JP[c.attr]}</div><div class="name">No.${c.no}</div>`;
    d.onclick=()=>{selectedSlot=i;renderFormation();};
    slots.appendChild(d);
  });
  getBattleOwned().forEach(c=>{
    const row=document.createElement("div");
    row.className="char-row";
    row.innerHTML=`<span>★${c.rarity} No.${c.no} ${c.name}<br>${JP[c.attr]} / Lv${c.lv||1}</span><span>編成</span>`;
    row.onclick=()=>{save.partyNos[selectedSlot]=c.no;saveData();renderFormation();};
    list.appendChild(row);
  });
}

function renderParty(){
  party=(save.partyNos||[1,2,3,4,5,6]).slice(0,6).map(no=>getCharByNo(no));
  playerMaxHp=party.reduce((s,c)=>s+stat(c,"hp"),0);
  totalRcv=party.reduce((s,c)=>s+stat(c,"rcv"),0);
  partyEl.innerHTML="";
  party.forEach((c,i)=>{
    const d=document.createElement("div");
    d.className="member "+(i===0?"leader":i===5?"friend":"");
    d.innerHTML=`<div class="role">${i===0?"L":i===5?"F":""}</div><div class="atk">攻 ${stat(c,"atk")}</div><div class="icon ${BG[c.attr]}">${JP[c.attr]}</div><div class="name">No.${c.no}</div>`;
    partyEl.appendChild(d);
  });
}

function addOwned(c){
  const f=save.owned.find(x=>x.no===c.no);
  if(f)f.count=(f.count||1)+1;
  else save.owned.push({...c,count:1,lv:1});
}

function doGacha(n){
  const cost=n*5;
  if(save.stone<cost)return modal("ガチャ石不足",`必要ガチャ石：${cost}`,[{label:"OK"}]);
  save.stone-=cost;
  const got=[];
  for(let i=0;i<n;i++){
    const r=Math.random()*100;
    const rare=r<2?6:r<7?5:r<22?4:r<60?3:2;
    const pool=gachaChars.filter(c=>c.rarity===rare);
    const c={...pool[Math.floor(Math.random()*pool.length)]};
    got.push(c);addOwned(c);
  }
  saveData();$("gachaStoneText").textContent=save.stone;updateHome();
  $("gachaResult").innerHTML=`<div class="gacha-grid">${got.map(c=>`<div class="gacha-card rare${c.rarity}"><div class="icon ${BG[c.attr]}">${JP[c.attr]}</div>★${c.rarity}<br>No.${c.no}<br>${c.name}</div>`).join("")}</div>`;
}

function startDungeon(){
  renderParty();
  floorIndex=0;
  floors=[
    {name:"モリスライム",attr:"wood",hp:5000,atk:850},
    {name:"アクアゴブリン",attr:"water",hp:6500,atk:950},
    {name:"ファイアドラゴン",attr:"fire",hp:8000,atk:1100},
    {name:"ダークナイト",attr:"dark",hp:9500,atk:1300},
    {name:"ライトゴーレム",attr:"light",hp:13000,atk:1600}
  ];
  playerHp=playerMaxHp;
  setEnemy();
  createBoard();
  showScreen("battle");
  message.textContent="ドロップを動かしたら操作開始";
}

function setEnemy(){
  const e=floors[floorIndex];
  enemyMaxHp=e.hp;enemyHp=e.hp;enemyAtk=e.atk;
  $("enemyName").textContent=e.name;
  $("enemyIcon").className="enemy "+BG[e.attr];
  $("floorText").textContent=floorIndex+1;
  $("enemyAtkText").textContent=enemyAtk;
  updateHp();
}

function updateHp(){
  $("enemyHpText").textContent=enemyHp;
  $("enemyMaxHpText").textContent=enemyMaxHp;
  $("enemyHpBar").style.width=(enemyHp/enemyMaxHp*100)+"%";
  $("playerHpText").textContent=playerHp;
  $("playerMaxHpText").textContent=playerMaxHp;
  $("playerHpBar").style.width=(playerHp/playerMaxHp*100)+"%";
}

function retreatDungeon(){showScreen("dungeonMenu");}

function createBoard(){
  board=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++)row.push(TYPES[Math.floor(Math.random()*TYPES.length)]);
    board.push(row);
  }
  renderBoard();
}

function renderBoard(){
  boardEl.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const o=document.createElement("div");
    o.className="orb "+board[r][c];
    o.textContent=ICONS[board[r][c]];
    if(selected&&selected.r===r&&selected.c===c&&dragging)o.classList.add("held");
    boardEl.appendChild(o);
  }
}

function getCell(x,y){
  const rect=boardEl.getBoundingClientRect();
  const c=Math.floor((x-rect.left)/(rect.width/COLS));
  const r=Math.floor((y-rect.top)/(rect.height/ROWS));
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  return{r,c};
}
function swap(a,b){const t=board[a.r][a.c];board[a.r][a.c]=board[b.r][b.c];board[b.r][b.c]=t;}
function near(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;}

function createGhost(type,x,y){
  removeGhost();
  const rect=boardEl.getBoundingClientRect();
  const size=Math.min(rect.width/COLS-4,rect.height/ROWS-4);
  dragGhost=document.createElement("div");
  dragGhost.className="drag-orb "+type;
  dragGhost.textContent=ICONS[type];
  dragGhost.style.width=size+"px";
  dragGhost.style.height=size+"px";
  boardWrap.appendChild(dragGhost);
  moveGhost(x,y);
}
function moveGhost(x,y){
  if(!dragGhost)return;
  const rect=boardWrap.getBoundingClientRect();
  dragGhost.style.left=(x-rect.left)+"px";
  dragGhost.style.top=(y-rect.top)+"px";
}
function removeGhost(){if(dragGhost){dragGhost.remove();dragGhost=null;}}

function startTimer(){
  clearInterval(timerId);
  const start=performance.now();
  timerId=setInterval(()=>{
    const left=Math.max(0,MOVE_TIME-(performance.now()-start)/1000);
    $("timerText").textContent=left.toFixed(1);
    $("timerBar").style.width=(left/MOVE_TIME*100)+"%";
    if(left<=0)endDrag();
  },50);
}

function startDrag(e){
  e.preventDefault();
  if(resolving||enemyHp<=0||playerHp<=0)return;
  const cell=getCell(e.clientX,e.clientY);
  if(!cell)return;
  dragging=true;movedOnce=false;selected=cell;
  createGhost(board[cell.r][cell.c],e.clientX,e.clientY);
  renderBoard();
}
function moveDrag(e){
  e.preventDefault();
  if(!dragging||!selected)return;
  moveGhost(e.clientX,e.clientY);
  const cell=getCell(e.clientX,e.clientY);
  if(!cell||cell.r===selected.r&&cell.c===selected.c)return;
  if(!near(selected,cell))return;
  if(!movedOnce){movedOnce=true;startTimer();message.textContent="操作中…";}
  swap(selected,cell);selected=cell;renderBoard();
}
function endDrag(e){
  if(e)e.preventDefault();
  if(!dragging)return;
  dragging=false;selected=null;clearInterval(timerId);removeGhost();renderBoard();
  if(movedOnce)resolveBoard();
}

function getMatches(){
  const mark={};
  for(let r=0;r<ROWS;r++){
    let count=1;
    for(let c=1;c<=COLS;c++){
      if(c<COLS&&board[r][c]===board[r][c-1])count++;
      else{if(count>=3)for(let k=0;k<count;k++)mark[r+","+(c-1-k)]=true;count=1;}
    }
  }
  for(let c=0;c<COLS;c++){
    let count=1;
    for(let r=1;r<=ROWS;r++){
      if(r<ROWS&&board[r][c]===board[r-1][c])count++;
      else{if(count>=3)for(let k=0;k<count;k++)mark[(r-1-k)+","+c]=true;count=1;}
    }
  }
  return mark;
}
function showCombo(n){
  const e=document.createElement("div");
  e.className="combo-effect";
  e.textContent=n+"コンボ！";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),900);
}
async function resolveBoard(){
  resolving=true;
  let combo=0;
  while(true){
    const m=getMatches();
    const keys=Object.keys(m);
    if(!keys.length)break;
    combo++;showCombo(combo);
    keys.forEach(k=>{const [r,c]=k.split(",").map(Number);board[r][c]=null;});
    renderBoard();
    await sleep(250);
    dropOrbs();
    renderBoard();
    await sleep(250);
  }
  if(combo>0)attack(combo);
  else enemyAttack();
  resolving=false;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function dropOrbs(){
  for(let c=0;c<COLS;c++){
    const remain=[];
    for(let r=ROWS-1;r>=0;r--)if(board[r][c])remain.push(board[r][c]);
    while(remain.length<ROWS)remain.push(TYPES[Math.floor(Math.random()*TYPES.length)]);
    for(let r=ROWS-1;r>=0;r--)board[r][c]=remain[ROWS-1-r];
  }
}
function pop(target,text,cls){
  const d=document.createElement("div");
  d.className="float "+cls;
  d.textContent=text;
  target.appendChild(d);
  setTimeout(()=>d.remove(),1600);
}
function attack(combo){
  const atk=party.reduce((s,c)=>s+stat(c,"atk"),0);
  const dmg=Math.floor(atk*(1+(combo-1)*0.25));
  enemyHp=Math.max(0,enemyHp-dmg);
  pop($("enemyIcon"),dmg,"damage");
  updateHp();
  message.textContent=combo+"コンボ！ "+dmg+"ダメージ！";
  if(enemyHp<=0){
    setTimeout(nextFloor,800);
  }else{
    enemyAttack();
  }
}
function enemyAttack(){
  playerHp=Math.max(0,playerHp-enemyAtk);
  pop($("playerArea"),"-"+enemyAtk,"hurt");
  updateHp();
  if(playerHp<=0)message.textContent="ゲームオーバー…";
  else message.textContent+=" / 敵の攻撃！";
}
function nextFloor(){
  if(floorIndex>=4){
    const gold=1000+save.clearedNormal*150;
    save.money+=gold;
    save.stone+=20;
    save.clearedNormal++;
    saveData();
    $("resultSummary").innerHTML=`獲得ゴールド：+${gold}<br>獲得ガチャ石：+20`;
    showScreen("result");
  }else{
    floorIndex++;
    setEnemy();
    message.textContent="次の階層へ！";
  }
}

function modal(title,text,buttons){
  $("modalTitle").textContent=title;
  $("modalText").textContent=text;
  const b=$("modalButtons");
  b.innerHTML="";
  buttons.forEach(x=>{
    const btn=document.createElement("button");
    btn.textContent=x.label;
    btn.onclick=()=>{closeModal();x.fn&&x.fn();};
    b.appendChild(btn);
  });
  $("modal").classList.add("active");
}
function closeModal(){$("modal").classList.remove("active");}

boardEl.addEventListener("pointerdown",startDrag);
window.addEventListener("pointermove",moveDrag);
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);

updateHome();
</script>
</body>
</html>
