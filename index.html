<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>パズルRPG</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:white;font-family:sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.game{width:100%;max-width:430px;height:100svh;padding:7px;display:flex;flex-direction:column;gap:6px}
.panel{background:#111827;border-radius:14px;padding:8px}
.enemy-area{display:flex;gap:8px;align-items:center}
.enemy{width:56px;height:56px;border-radius:50%;position:relative;flex-shrink:0}
.enemy.hit{animation:hit .18s}
@keyframes hit{50%{transform:scale(.84);filter:brightness(2)}}
.enemy-info{flex:1;font-size:12px;color:#cbd5e1}
.enemy-name{font-size:18px;font-weight:bold;color:white}
.hp-wrap{height:12px;background:#020617;border-radius:999px;overflow:hidden;margin:4px 0}
.enemy-hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#bef264);transition:.25s}
.message{background:#020617;border-radius:12px;min-height:35px;padding:7px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff3ad;font-size:15px;font-weight:bold}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.member{background:#1e293b;border-radius:9px;padding:3px;text-align:center}
.member .atk{font-size:10px;color:#fde68a;font-weight:bold}
.member .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
.member .name{font-size:9px}
.player{background:#111827;border-radius:12px;padding:7px;position:relative}
.player.hit{animation:shake .25s}
.player.heal{animation:heal .25s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes heal{50%{filter:brightness(1.8)}}
.hp-text{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-bottom:4px}
.player-hp-bar{height:12px;background:#020617;border-radius:999px;overflow:hidden}
.player-hp-inner{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316,#facc15);transition:.25s}
.timer{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:bold}
.timer-wrap{flex:1;height:9px;background:#020617;border-radius:999px;overflow:hidden}
.timer-bar{height:100%;width:100%;background:#38bdf8}
.board-wrap{background:#1f2937;border-radius:18px;padding:6px;flex:1;display:flex}
.board{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.orb{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,34px);font-weight:bold;transition:transform .03s,opacity .12s}
.selected{transform:scale(1.02)}
.clear{opacity:0;transform:scale(.1)}
.buttons{display:flex;gap:6px}
button{flex:1;border:0;border-radius:12px;padding:8px;font-size:14px;font-weight:bold;background:#eef2ff;color:#111827}
.status{font-size:11px;color:#cbd5e1;line-height:1.35;background:#020617;border-radius:10px;padding:6px}
.float{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;pointer-events:none;animation:floatUp .9s forwards;text-shadow:0 2px 4px #000;z-index:50}
.damage{color:#ffe066}.healNum{color:#5dff9d}.hurt{color:#ff7b7b}
@keyframes floatUp{20%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-145%) scale(1)}}
.fire,.fire-bg{background:radial-gradient(circle at 30% 30%,#ffd4a8,#ef4444)}
.water,.water-bg{background:radial-gradient(circle at 30% 30%,#d7f1ff,#3b82f6)}
.wood,.wood-bg{background:radial-gradient(circle at 30% 30%,#e4ffd8,#22c55e)}
.light,.light-bg{background:radial-gradient(circle at 30% 30%,#fffad1,#facc15);color:#111827}
.dark,.dark-bg{background:radial-gradient(circle at 30% 30%,#f5d0fe,#9333ea)}
.heart{background:radial-gradient(circle at 30% 30%,#ffe4f0,#ec4899)}
</style>
</head>

<body>
<div class="game">

<div class="panel">
  <div class="enemy-area">
    <div class="enemy wood-bg" id="enemyIcon"></div>
    <div class="enemy-info">
      <div class="enemy-name" id="enemyName">モリスライム</div>
      <div>階層：<span id="floorText">1</span>/5 / 属性：<span id="enemyAttrText">木</span> / 攻撃：<span id="enemyAtkText">850</span> / 攻撃まで：<span id="enemyTurnText">1</span></div>
      <div class="hp-wrap"><div class="enemy-hp-bar" id="enemyHpBar"></div></div>
      <div>敵HP：<span id="enemyHpText">5000</span>/<span id="enemyMaxHpText">5000</span></div>
    </div>
  </div>
</div>

<div class="message" id="message">ドロップを動かしたら5秒開始</div>

<div class="party" id="party"></div>

<div class="player" id="playerArea">
  <div class="hp-text">
    <span>味方HP</span>
    <span><span id="playerHpText">5550</span>/<span id="playerMaxHpText">5550</span></span>
  </div>
  <div class="player-hp-bar"><div class="player-hp-inner" id="playerHpBar"></div></div>
</div>

<div class="timer">
  <span>操作 <span id="timerText">5.0</span>秒</span>
  <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="buttons">
  <button onclick="resetDungeon()">最初から</button>
  <button onclick="retreatDungeon()">撤退</button>
</div>

<div class="status" id="status"></div>

</div>

<script>
const ROWS=5,COLS=6,MOVE_TIME=5;
const TYPES=["fire","water","wood","light","dark","heart"];
const ICONS={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"♡"};
const JP={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"回復"};
const BG={fire:"fire-bg",water:"water-bg",wood:"wood-bg",light:"light-bg",dark:"dark-bg"};

const members=[
 {no:1,attr:"fire",hp:500,atk:150,rcv:15},
 {no:2,attr:"water",hp:1500,atk:50,rcv:45},
 {no:3,attr:"wood",hp:1000,atk:100,rcv:30},
 {no:4,attr:"dark",hp:750,atk:180,rcv:0},
 {no:5,attr:"light",hp:1200,atk:100,rcv:50},
 {no:6,attr:"fire",hp:600,atk:130,rcv:25}
];

const dungeon={
 id:"forest_001",
 name:"はじまりの森",
 difficulty:"初級",
 firstGacha:20,
 reward:{
  money:[500,1000],
  enhance:[1,3],
  skill:[0,1],
  awaken:[0,0]
 },
 floors:[
  {name:"モリスライム",attr:"wood",hp:5000,atk:850,turn:1,dropRate:.5,gachaRate:.35,drop:{id:101,name:"モリスライム",attr:"wood"}},
  {name:"アクアゴブリン",attr:"water",hp:6500,atk:950,turn:2,dropRate:.4,gachaRate:.35,drop:{id:102,name:"アクアゴブリン",attr:"water"}},
  {name:"ファイアドラゴン",attr:"fire",hp:9000,atk:1200,turn:2,dropRate:.35,gachaRate:.4,drop:{id:103,name:"ファイアドラゴン",attr:"fire"}},
  {name:"ダークナイト",attr:"dark",hp:12000,atk:1500,turn:2,dropRate:.3,gachaRate:.45,drop:{id:104,name:"ダークナイト",attr:"dark"}},
  {name:"ライトゴーレム",attr:"light",hp:16000,atk:1800,turn:3,dropRate:.25,gachaRate:.5,drop:{id:105,name:"ライトゴーレム",attr:"light"}}
 ]
};

let save=JSON.parse(localStorage.getItem("puzzleRpgSave")||"null")||{
 money:0,gacha:0,enhance:0,awaken:0,
 skill:{fire:0,water:0,wood:0,light:0,dark:0},
 owned:[],
 cleared:{}
};

let board=[],dragging=false,movedOnce=false,resolving=false,selected=null,timerId=null;
let playerMaxHp=members.reduce((s,m)=>s+m.hp,0),playerHp=playerMaxHp,totalRcv=members.reduce((s,m)=>s+m.rcv,0);
let floorIndex=0,enemyHp=0,enemyMaxHp=0,enemyAttr="",enemyAtk=0,enemyTurn=1,enemyTurnMax=1;
let tempDrops=[],tempGacha=0;

const boardEl=document.getElementById("board"),partyEl=document.getElementById("party"),message=document.getElementById("message");
const enemyIcon=document.getElementById("enemyIcon"),enemyName=document.getElementById("enemyName"),enemyHpBar=document.getElementById("enemyHpBar");
const enemyHpText=document.getElementById("enemyHpText"),enemyMaxHpText=document.getElementById("enemyMaxHpText"),enemyAttrText=document.getElementById("enemyAttrText");
const enemyAtkText=document.getElementById("enemyAtkText"),enemyTurnText=document.getElementById("enemyTurnText"),floorText=document.getElementById("floorText");
const playerArea=document.getElementById("playerArea"),playerHpText=document.getElementById("playerHpText"),playerMaxHpText=document.getElementById("playerMaxHpText"),playerHpBar=document.getElementById("playerHpBar");
const timerText=document.getElementById("timerText"),timerBar=document.getElementById("timerBar"),statusEl=document.getElementById("status");

function saveData(){localStorage.setItem("puzzleRpgSave",JSON.stringify(save))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randomType(){return TYPES[Math.floor(Math.random()*TYPES.length)]}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function pop(target,text,cls){const d=document.createElement("div");d.className="float "+cls;d.textContent=text;target.appendChild(d);setTimeout(()=>d.remove(),900)}
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),260)}

function renderParty(){
 partyEl.innerHTML="";
 members.forEach(m=>{
  const d=document.createElement("div");
  d.className="member";
  d.innerHTML=`<div class="atk">攻 ${m.atk}</div><div class="icon ${BG[m.attr]}">${JP[m.attr]}</div><div class="name">No.${m.no}</div>`;
  partyEl.appendChild(d);
 });
}

function updateStatus(){
 statusEl.innerHTML=
 `所持：お金${save.money} / ガチャ素材${save.gacha} / 強化${save.enhance} / 覚醒${save.awaken}<br>`+
 `仮獲得：キャラ${tempDrops.length}体 / ガチャ素材${tempGacha}個　※クリア以外は没収`;
}

function createBoard(){
 board=[];
 for(let r=0;r<ROWS;r++){
  const row=[];
  for(let c=0;c<COLS;c++)row.push(randomType());
  board.push(row);
 }
 renderBoard();
}

function renderBoard(){
 boardEl.innerHTML="";
 for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
   const o=document.createElement("div");
   o.className="orb "+board[r][c];
   o.textContent=ICONS[board[r][c]];
   if(selected&&selected.r===r&&selected.c===c)o.classList.add("selected");
   boardEl.appendChild(o);
  }
 }
}

function getCell(x,y){
 const rect=boardEl.getBoundingClientRect(),cw=rect.width/COLS,ch=rect.height/ROWS;
 const c=Math.floor((x-rect.left)/cw),r=Math.floor((y-rect.top)/ch);
 if(r<0||c<0||r>=ROWS||c>=COLS)return null;
 return{r,c};
}
function swap(a,b){const t=board[a.r][a.c];board[a.r][a.c]=board[b.r][b.c];board[b.r][b.c]=t}
function isNear(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}

function startTimer(){
 stopTimer();
 const start=performance.now();
 timerId=setInterval(()=>{
  const left=Math.max(0,MOVE_TIME-(performance.now()-start)/1000);
  timerText.textContent=left.toFixed(1);
  timerBar.style.width=(left/MOVE_TIME*100)+"%";
  if(left<=0)endDrag();
 },50);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function startDrag(e){
 e.preventDefault();
 if(resolving||playerHp<=0||enemyHp<=0)return;
 const cell=getCell(e.clientX,e.clientY);
 if(!cell)return;
 dragging=true;movedOnce=false;selected=cell;
 renderBoard();
}

function moveOneStep(next){
 if(!selected||!next)return false;
 if(next.r<0||next.c<0||next.r>=ROWS||next.c>=COLS)return false;
 if(!isNear(selected,next))return false;
 if(!movedOnce){movedOnce=true;startTimer();message.textContent="操作中…"}
 swap(selected,next);
 selected=next;
 return true;
}

function moveDrag(e){
 e.preventDefault();
 if(!dragging||!selected||resolving)return;
 const cell=getCell(e.clientX,e.clientY);
 if(!cell||(cell.r===selected.r&&cell.c===selected.c))return;
 const dr=cell.r-selected.r,dc=cell.c-selected.c;
 const sr=Math.sign(dr),sc=Math.sign(dc);
 let changed=false;
 if(Math.abs(dc)>=Math.abs(dr)){
  if(sc)changed=moveOneStep({r:selected.r,c:selected.c+sc})||changed;
  if(sr)changed=moveOneStep({r:selected.r+sr,c:selected.c})||changed;
 }else{
  if(sr)changed=moveOneStep({r:selected.r+sr,c:selected.c})||changed;
  if(sc)changed=moveOneStep({r:selected.r,c:selected.c+sc})||changed;
 }
 if(changed)renderBoard();
}

function endDrag(e){
 if(e)e.preventDefault();
 if(!dragging)return;
 dragging=false;selected=null;stopTimer();renderBoard();
 if(!movedOnce)return;
 resolveBoard();
}

function getMatchedMap(){
 const map={};
 for(let r=0;r<ROWS;r++){
  let count=1;
  for(let c=1;c<=COLS;c++){
   if(c<COLS&&board[r][c]&&board[r][c]===board[r][c-1])count++;
   else{if(count>=3)for(let k=0;k<count;k++)map[r+","+(c-1-k)]=true;count=1}
  }
 }
 for(let c=0;c<COLS;c++){
  let count=1;
  for(let r=1;r<=ROWS;r++){
   if(r<ROWS&&board[r][c]&&board[r][c]===board[r-1][c])count++;
   else{if(count>=3)for(let k=0;k<count;k++)map[(r-1-k)+","+c]=true;count=1}
  }
 }
 return map;
}

function getGroups(){
 const matched=getMatchedMap(),visited={},groups=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 Object.keys(matched).forEach(key=>{
  if(visited[key])return;
  const [sr,sc]=key.split(",").map(Number),type=board[sr][sc],stack=[{r:sr,c:sc}],cells=[];
  visited[key]=true;
  while(stack.length){
   const cur=stack.pop();cells.push(cur);
   dirs.forEach(([dr,dc])=>{
    const nr=cur.r+dr,nc=cur.c+dc,nk=nr+","+nc;
    if(nr<0||nc<0||nr>=ROWS||nc>=COLS||!matched[nk]||visited[nk]||board[nr][nc]!==type)return;
    visited[nk]=true;stack.push({r:nr,c:nc});
   });
  }
  groups.push({type,cells,count:cells.length});
 });
 return groups;
}

async function resolveBoard(){
 resolving=true;
 let combo=0,cleared=[];
 while(true){
  const groups=getGroups();
  if(!groups.length)break;
  for(const g of groups){
   combo++;
   cleared.push({...g,combo});
   message.textContent=combo+"コンボ！ "+JP[g.type]+"を"+g.count+"個消した";
   markClear(g.cells);
   await sleep(220);
   g.cells.forEach(cell=>board[cell.r][cell.c]=null);
   renderBoard();
   await sleep(80);
  }
  dropOrbs();
  renderBoard();
  await sleep(250);
 }
 if(combo===0){message.textContent="コンボなし";enemyAttack();resolving=false;return}
 const result=calcDamage(cleared,combo);
 applyResult(result,combo);
 await sleep(650);
 if(enemyHp<=0)floorClear();
 else enemyAttack();
 resolving=false;
}

function markClear(cells){
 const orbs=[...boardEl.children];
 cells.forEach(cell=>{const i=cell.r*COLS+cell.c;if(orbs[i])orbs[i].classList.add("clear")});
}

function dropOrbs(){
 for(let c=0;c<COLS;c++){
  const remain=[];
  for(let r=ROWS-1;r>=0;r--)if(board[r][c])remain.push(board[r][c]);
  while(remain.length<ROWS)remain.push(randomType());
  for(let r=ROWS-1;r>=0;r--)board[r][c]=remain[ROWS-1-r];
 }
}

function comboMul(combo){return 1+(combo-1)*.25}
function orbMul(count){return 1+(count-3)*.25}
function leaderMul(combo){let m=1;if(combo>=5)m*=3;else if(combo>=4)m*=2;if(combo>=7)m*=5;return m}
function attrRate(a,d){
 if(a==="fire"&&d==="wood")return 2;if(a==="fire"&&d==="water")return .5;
 if(a==="water"&&d==="fire")return 2;if(a==="water"&&d==="wood")return .5;
 if(a==="wood"&&d==="water")return 2;if(a==="wood"&&d==="fire")return .5;
 if(a==="light"&&d==="dark")return 2;if(a==="dark"&&d==="light")return 2;
 return 1;
}

function calcDamage(groups,combo){
 let dmg=0,heal=0;
 const cm=comboMul(combo),lm=leaderMul(combo);
 groups.forEach(g=>{
  const om=orbMul(g.count);
  if(g.type==="heart"){heal+=Math.floor(totalRcv*om*cm);return}
  members.filter(m=>m.attr===g.type).forEach(m=>{
   dmg+=Math.floor(m.atk*om*cm*lm*attrRate(m.attr,enemyAttr));
  });
 });
 return{dmg,heal,lm};
}

function applyResult(res,combo){
 if(res.heal>0){playerHp=Math.min(playerMaxHp,playerHp+res.heal);pop(playerArea,"+"+res.heal,"healNum");flash(playerArea,"heal")}
 if(res.dmg>0){enemyHp=Math.max(0,enemyHp-res.dmg);pop(enemyIcon,res.dmg,"damage");flash(enemyIcon,"hit")}
 updateHp();
 let text=combo+"コンボ！ "+res.dmg+"ダメージ！";
 if(res.heal>0)text+=" HP"+res.heal+"回復！";
 if(res.lm>1)text+=" LS"+res.lm+"倍！";
 if(enemyHp<=0)text+=" 撃破！";
 message.textContent=text;
}

function enemyAttack(){
 if(enemyHp<=0||playerHp<=0)return;
 enemyTurn--;
 if(enemyTurn<=0){
  playerHp=Math.max(0,playerHp-enemyAtk);
  enemyTurn=enemyTurnMax;
  pop(playerArea,"-"+enemyAtk,"hurt");
  flash(playerArea,"hit");
  updateHp();
  if(playerHp<=0){
   tempDrops=[];tempGacha=0;updateStatus();
   message.textContent="ゲームオーバー… 仮獲得は全て没収";
  }else message.textContent+=" / 敵の攻撃！"+enemyAtk+"ダメージ";
 }
 enemyTurnText.textContent=enemyTurn;
}

function floorClear(){
 const floor=dungeon.floors[floorIndex];
 if(Math.random()<floor.dropRate){
  tempDrops.push(floor.drop);
  message.textContent+=" / "+floor.drop.name+"がドロップ！";
 }
 if(save.cleared[dungeon.id] && Math.random()<floor.gachaRate){
  tempGacha++;
  message.textContent+=" / ガチャ素材+1";
 }
 updateStatus();
 setTimeout(()=>{
  if(floorIndex>=dungeon.floors.length-1)clearDungeon();
  else{floorIndex++;setEnemy();createBoard();message.textContent="次の階層へ！"}
 },900);
}

function clearDungeon(){
 const first=!save.cleared[dungeon.id];
 const money=rand(...dungeon.reward.money);
 const enhance=rand(...dungeon.reward.enhance);
 const awaken=rand(...dungeon.reward.awaken);
 const skill=rand(...dungeon.reward.skill);
 const skillAttr=["fire","water","wood","light","dark"][rand(0,4)];
 const gacha=first?dungeon.firstGacha:tempGacha;

 save.money+=money;
 save.enhance+=enhance;
 save.awaken+=awaken;
 save.skill[skillAttr]+=skill;
 save.gacha+=gacha;
 save.owned.push(...tempDrops);
 save.cleared[dungeon.id]=true;
 saveData();

 message.innerHTML=
 `ダンジョンクリア！<br>`+
 `お金+${money} / 強化+${enhance} / 覚醒+${awaken} / ${JP[skillAttr]}スキル素材+${skill} / ガチャ素材+${gacha} / キャラ+${tempDrops.length}`;

 tempDrops=[];tempGacha=0;
 updateStatus();
}

function retreatDungeon(){
 tempDrops=[];tempGacha=0;
 updateStatus();
 message.textContent="撤退したため、仮獲得は全て没収";
 resetDungeon();
}

function setEnemy(){
 const e=dungeon.floors[floorIndex];
 enemyMaxHp=e.hp;enemyHp=e.hp;enemyAttr=e.attr;enemyAtk=e.atk;enemyTurnMax=e.turn;enemyTurn=e.turn;
 enemyName.textContent=e.name;enemyAttrText.textContent=JP[e.attr];enemyAtkText.textContent=e.atk;
 enemyIcon.className="enemy "+BG[e.attr];
 floorText.textContent=floorIndex+1;
 updateHp();
}

function updateHp(){
 enemyHpText.textContent=enemyHp;enemyMaxHpText.textContent=enemyMaxHp;enemyHpBar.style.width=(enemyHp/enemyMaxHp*100)+"%";
 playerHpText.textContent=playerHp;playerMaxHpText.textContent=playerMaxHp;playerHpBar.style.width=(playerHp/playerMaxHp*100)+"%";
 enemyTurnText.textContent=enemyTurn;
}

function resetDungeon(){
 stopTimer();dragging=false;movedOnce=false;resolving=false;selected=null;
 floorIndex=0;playerHp=playerMaxHp;tempDrops=[];tempGacha=0;
 timerText.textContent="5.0";timerBar.style.width="100%";
 setEnemy();createBoard();updateStatus();
 message.textContent=save.cleared[dungeon.id]?"ドロップを動かしたら5秒開始":"初回クリア報酬：ガチャ素材20個";
}

boardEl.addEventListener("pointerdown",startDrag);
window.addEventListener("pointermove",moveDrag);
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);

renderParty();
resetDungeon();
</script>
</body>
</html>
