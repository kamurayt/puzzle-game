<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>パズルRPG</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0f172a;
font-family:sans-serif;
color:white;
touch-action:none;
}

body{
display:flex;
justify-content:center;
}

.game{
width:100%;
max-width:430px;
height:100svh;
padding:8px;
display:flex;
flex-direction:column;
gap:8px;
}

.screen{
display:none;
height:100%;
flex-direction:column;
gap:8px;
}

.screen.active{
display:flex;
}

.title{
font-size:28px;
font-weight:900;
text-align:center;
color:#fff3ad;
margin-top:8px;
}

.card{
background:#111827;
border-radius:16px;
padding:10px;
position:relative;
}

button{
border:none;
border-radius:14px;
padding:12px;
font-size:17px;
font-weight:900;
background:#eef2ff;
color:#111827;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.status{
background:#020617;
border-radius:12px;
padding:10px;
font-size:13px;
line-height:1.6;
color:#cbd5e1;
}

.enemy-area{
display:flex;
gap:8px;
align-items:center;
}

.enemy{
width:58px;
height:58px;
border-radius:50%;
flex-shrink:0;
position:relative;
}

.enemy.hit{
animation:enemyHit .2s;
}

@keyframes enemyHit{
50%{
transform:scale(.8);
filter:brightness(2);
}
}

.enemy-info{
flex:1;
padding-right:60px;
font-size:12px;
}

.enemy-name{
font-size:18px;
font-weight:900;
color:white;
}

.hp-wrap{
height:12px;
background:#020617;
border-radius:999px;
overflow:hidden;
margin:4px 0;
}

.enemy-hp-bar{
height:100%;
width:100%;
background:linear-gradient(90deg,#22c55e,#bef264);
transition:.25s;
}

.top-retreat{
position:absolute;
right:8px;
top:8px;
padding:6px 10px;
font-size:12px;
border-radius:999px;
background:#fee2e2;
color:#991b1b;
}

.party{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:4px;
}

.member{
background:#1e293b;
border-radius:10px;
padding:3px;
text-align:center;
position:relative;
}

.member .atk{
font-size:10px;
color:#fde68a;
font-weight:900;
}

.member .icon{
width:100%;
aspect-ratio:1;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
font-weight:900;
}

.member .name{
font-size:9px;
}

.player{
background:#111827;
border-radius:12px;
padding:7px;
position:relative;
}

.player.hit{
animation:shake .25s;
}

.player.heal{
animation:heal .25s;
}

@keyframes shake{
25%{transform:translateX(-4px)}
50%{transform:translateX(4px)}
}

@keyframes heal{
50%{filter:brightness(1.8)}
}

.hp-text{
display:flex;
justify-content:space-between;
font-size:13px;
font-weight:900;
margin-bottom:4px;
}

.player-hp-bar{
height:12px;
background:#020617;
border-radius:999px;
overflow:hidden;
}

.player-hp-inner{
height:100%;
width:100%;
background:linear-gradient(90deg,#ef4444,#f97316,#facc15);
transition:.25s;
}

.timer{
display:flex;
gap:6px;
align-items:center;
font-size:13px;
font-weight:900;
}

.timer-wrap{
flex:1;
height:9px;
background:#020617;
border-radius:999px;
overflow:hidden;
}

.timer-bar{
height:100%;
width:100%;
background:#38bdf8;
}

.board-wrap{
background:#1f2937;
border-radius:18px;
padding:6px;
flex:1;
display:flex;
position:relative;
overflow:hidden;
min-height:310px;
}

.board{
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(6,1fr);
grid-template-rows:repeat(5,1fr);
gap:4px;
}

.orb{
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(25px,9vw,40px);
font-weight:900;
transition:transform .07s ease,opacity .07s ease;
}

.orb.held{
opacity:.15;
transform:scale(.9);
}

.orb.clear{
opacity:0;
transform:scale(.1);
}

.drag-orb{
position:absolute;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(25px,9vw,40px);
font-weight:900;
pointer-events:none;
z-index:100;
transform:translate(-50%,-50%) scale(1.08);
box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.float{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:24px;
font-weight:900;
pointer-events:none;
animation:floatUp 1.6s forwards;
text-shadow:0 2px 4px #000;
z-index:50;
white-space:nowrap;
}

.member .float{
font-size:15px;
}

.damage{
color:#ffe066;
}

.healNum{
color:#5dff9d;
}

.hurt{
color:#ff7b7b;
}

@keyframes floatUp{
20%{
opacity:1;
transform:translate(-50%,-65%) scale(1.1);
}
100%{
opacity:0;
transform:translate(-50%,-145%) scale(1);
}
}

.combo-effect{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:42px;
font-weight:900;
color:#fff3ad;
text-shadow:
0 0 12px #facc15,
0 0 24px #f59e0b,
0 4px 10px #000;
pointer-events:none;
z-index:9999;
animation:comboAnim .9s forwards;
}

@keyframes comboAnim{
0%{
opacity:0;
transform:translate(-50%,-50%) scale(.4);
}
20%{
opacity:1;
transform:translate(-50%,-50%) scale(1.25);
}
70%{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}
100%{
opacity:0;
transform:translate(-50%,-80%) scale(1.1);
}
}

.fire,.fire-bg{
background:radial-gradient(circle at 30% 30%,#ffd4a8,#ef4444);
}

.water,.water-bg{
background:radial-gradient(circle at 30% 30%,#d7f1ff,#3b82f6);
}

.wood,.wood-bg{
background:radial-gradient(circle at 30% 30%,#e4ffd8,#22c55e);
}

.light,.light-bg{
background:radial-gradient(circle at 30% 30%,#fffad1,#facc15);
color:#111827;
}

.dark,.dark-bg{
background:radial-gradient(circle at 30% 30%,#f5d0fe,#9333ea);
}

.none,.none-bg{
background:radial-gradient(circle at 30% 30%,#eee,#64748b);
}

.heart{
background:radial-gradient(circle at 30% 30%,#ffe4f0,#ec4899);
}

.message{
background:#020617;
border-radius:12px;
min-height:38px;
padding:7px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:15px;
font-weight:900;
color:#fff3ad;
}

.list{
overflow:auto;
display:flex;
flex-direction:column;
gap:6px;
padding-bottom:8px;
}

.char-row{
background:#1e293b;
border-radius:10px;
padding:8px;
font-size:13px;
display:flex;
justify-content:space-between;
align-items:center;
}

.result-box{
background:#111827;
border-radius:16px;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.result-title{
text-align:center;
font-size:26px;
font-weight:900;
color:#fff3ad;
}

.result-item{
background:#020617;
border-radius:12px;
padding:10px;
font-size:15px;
line-height:1.5;
}

.result-list{
max-height:240px;
overflow:auto;
display:flex;
flex-direction:column;
gap:6px;
}

.drop-row{
background:#1e293b;
border-radius:10px;
padding:8px;
font-size:13px;
}
</style>
</head>

<body>

<div class="game">

<section id="home" class="screen active">

<div class="title">
パズルRPG
</div>

<div class="status" id="homeStatus"></div>

<div class="menu">
<button onclick="showScreen('dungeonMenu')">ダンジョン</button>
<button onclick="showScreen('charMenu')">キャラ</button>
<button onclick="showScreen('gacha')">ガチャ</button>
</div>

</section>

<section id="dungeonMenu" class="screen">

<div class="title">
ダンジョン
</div>

<div class="menu">
<button onclick="startDungeon('normal')">ノーマルダンジョン</button>
<button onclick="startDungeon('skill')">スキル強化ダンジョン</button>
<button onclick="startDungeon('awake')">覚醒ダンジョン</button>
<button onclick="showScreen('home')">戻る</button>
</div>

</section>

<section id="charMenu" class="screen">

<div class="title">
キャラ一覧
</div>

<button onclick="showScreen('home')">
戻る
</button>

<div class="list" id="charList"></div>

</section>

<section id="gacha" class="screen">

<div class="title">
ガチャ
</div>

<div class="card">
現在のガチャ石：
<span id="gachaStoneText">0</span>
</div>

<button onclick="showScreen('home')">
戻る
</button>

</section>

<section id="result" class="screen">

<div class="result-box">

<div class="result-title">
ダンジョンクリア！
</div>

<div class="result-item" id="resultSummary"></div>

<div class="result-item">
<b>獲得キャラ</b>
<div class="result-list" id="resultDrops"></div>
</div>

<div class="menu">
<button onclick="showScreen('home')">
ホームへ
</button>

<button onclick="showScreen('dungeonMenu')">
ダンジョンへ
</button>
</div>

</div>

</section>

<section id="battle" class="screen">

<div class="card">

<button class="top-retreat" onclick="retreatDungeon()">
撤退
</button>

<div class="enemy-area">

<div class="enemy wood-bg" id="enemyIcon"></div>

<div class="enemy-info">

<div class="enemy-name" id="enemyName">
敵
</div>

<div>
<span id="battleTypeText">ノーマル</span>
/
階層：
<span id="floorText">1</span>/5
/
属性：
<span id="enemyAttrText">木</span>
/
攻撃：
<span id="enemyAtkText">850</span>
/
攻撃まで：
<span id="enemyTurnText">1</span>
</div>

<div class="hp-wrap">
<div class="enemy-hp-bar" id="enemyHpBar"></div>
</div>

<div>
敵HP：
<span id="enemyHpText">5000</span>
/
<span id="enemyMaxHpText">5000</span>
</div>

</div>
</div>
</div>

<div class="message" id="message">
ドロップを動かしたら5秒開始
</div>

<div class="party" id="party"></div>

<div class="player" id="playerArea">

<div class="hp-text">
<span>味方HP</span>
<span>
<span id="playerHpText">0</span>
/
<span id="playerMaxHpText">0</span>
</span>
</div>

<div class="player-hp-bar">
<div class="player-hp-inner" id="playerHpBar"></div>
</div>

</div>

<div class="timer">

<span>
操作
<span id="timerText">5.0</span>
秒
</span>

<div class="timer-wrap">
<div class="timer-bar" id="timerBar"></div>
</div>

</div>

<div class="board-wrap" id="boardWrap">
<div class="board" id="board"></div>
</div>

</section>

</div>

<script>
const ROWS=5,COLS=6,MOVE_TIME=5;

const TYPES=[
"fire",
"water",
"wood",
"light",
"dark",
"heart"
];

const ICONS={
fire:"火",
water:"水",
wood:"木",
light:"光",
dark:"闇",
heart:"♡"
};

const JP={
fire:"火",
water:"水",
wood:"木",
light:"光",
dark:"闇",
heart:"回復",
none:"無"
};

const BG={
fire:"fire-bg",
water:"water-bg",
wood:"wood-bg",
light:"light-bg",
dark:"dark-bg",
none:"none-bg"
};

const partyData=[
{no:1,rarity:1,attr:"fire",hp:500,atk:150,rcv:15},
{no:2,rarity:1,attr:"water",hp:1500,atk:50,rcv:45},
{no:3,rarity:1,attr:"wood",hp:1000,atk:100,rcv:30},
{no:4,rarity:1,attr:"dark",hp:750,atk:180,rcv:0},
{no:5,rarity:1,attr:"light",hp:1200,atk:100,rcv:50},
{no:6,rarity:1,attr:"fire",hp:600,atk:130,rcv:25}
];

let save=JSON.parse(localStorage.getItem("puzzleSave")||"null")||{
money:0,
stone:0,
owned:[...partyData.map(c=>({...c,count:1}))],
clearedNormal:0
};

let board=[];
let selected=null;
let dragging=false;
let moved=false;
let timerId=null;
let dragGhost=null;
let resolving=false;

let playerMaxHp=0;
let playerHp=0;
let totalRcv=0;

let enemyHp=5000;
let enemyMaxHp=5000;
let enemyAttr="wood";
let enemyAtk=850;

const $=id=>document.getElementById(id);

const boardEl=$("board");
const boardWrap=$("boardWrap");
const message=$("message");

function saveData(){
localStorage.setItem("puzzleSave",JSON.stringify(save));
}

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

$(id).classList.add("active");

updateHome();

if(id==="charMenu"){
renderCharList();
}

if(id==="gacha"){
$("gachaStoneText").textContent=save.stone;
}

}

function updateHome(){

$("homeStatus").innerHTML=
`ゴールド：${save.money}<br>
ガチャ石：${save.stone}<br>
ノーマル到達：${save.clearedNormal+1}`;

}

function renderCharList(){

const list=$("charList");

list.innerHTML="";

save.owned.forEach(c=>{

const row=document.createElement("div");

row.className="char-row";

row.innerHTML=
`<span>
★${c.rarity}
No.${c.no}
${JP[c.attr]}
</span>
<span>
×${c.count||1}
</span>`;

list.appendChild(row);

});

}

function renderParty(){

const party=$("party");

party.innerHTML="";

playerMaxHp=partyData.reduce((s,m)=>s+m.hp,0);

totalRcv=partyData.reduce((s,m)=>s+m.rcv,0);

playerHp=playerMaxHp;

partyData.forEach(m=>{

const d=document.createElement("div");

d.className="member";

d.innerHTML=
`
<div class="atk">
攻 ${m.atk}
</div>

<div class="icon ${BG[m.attr]}">
${JP[m.attr]}
</div>

<div class="name">
★${m.rarity}
</div>
`;

party.appendChild(d);

});

updatePlayerHp();

}

function updatePlayerHp(){

$("playerHpText").textContent=playerHp;

$("playerMaxHpText").textContent=playerMaxHp;

$("playerHpBar").style.width=
(playerHp/playerMaxHp*100)+"%";

}

function updateEnemyHp(){

$("enemyHpText").textContent=enemyHp;

$("enemyMaxHpText").textContent=enemyMaxHp;

$("enemyHpBar").style.width=
(enemyHp/enemyMaxHp*100)+"%";

}

function createBoard(){

board=[];

for(let r=0;r<ROWS;r++){

const row=[];

for(let c=0;c<COLS;c++){

row.push(
TYPES[Math.floor(Math.random()*TYPES.length)]
);

}

board.push(row);

}

renderBoard();

}

function renderBoard(){

boardEl.innerHTML="";

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

const orb=document.createElement("div");

orb.className="orb "+board[r][c];

orb.textContent=ICONS[board[r][c]];

if(
selected &&
selected.r===r &&
selected.c===c &&
dragging
){
orb.classList.add("held");
}

boardEl.appendChild(orb);

}

}

}

function getCell(x,y){

const rect=boardEl.getBoundingClientRect();

const cw=rect.width/COLS;
const ch=rect.height/ROWS;

const c=Math.floor((x-rect.left)/cw);
const r=Math.floor((y-rect.top)/ch);

if(r<0||c<0||r>=ROWS||c>=COLS){
return null;
}

return{r,c};

}

function createDragGhost(type,x,y){

removeDragGhost();

const rect=boardEl.getBoundingClientRect();

const size=rect.width/COLS-4;

dragGhost=document.createElement("div");

dragGhost.className="drag-orb "+type;

dragGhost.textContent=ICONS[type];

dragGhost.style.width=size+"px";
dragGhost.style.height=size+"px";

boardWrap.appendChild(dragGhost);

moveDragGhost(x,y);

}

function moveDragGhost(x,y){

if(!dragGhost)return;

const rect=boardWrap.getBoundingClientRect();

dragGhost.style.left=(x-rect.left)+"px";
dragGhost.style.top=(y-rect.top)+"px";

}

function removeDragGhost(){

if(dragGhost){

dragGhost.remove();

dragGhost=null;

}

}

function swap(a,b){

const t=board[a.r][a.c];

board[a.r][a.c]=board[b.r][b.c];

board[b.r][b.c]=t;

}

function near(a,b){

return Math.abs(a.r-b.r)+
Math.abs(a.c-b.c)===1;

}

function startTimer(){

stopTimer();

const start=performance.now();

timerId=setInterval(()=>{

const left=Math.max(
0,
MOVE_TIME-(performance.now()-start)/1000
);

$("timerText").textContent=
left.toFixed(1);

$("timerBar").style.width=
(left/MOVE_TIME*100)+"%";

if(left<=0){
endDrag();
}

},50);

}

function stopTimer(){

if(timerId){

clearInterval(timerId);

timerId=null;

}

}

function startDrag(e){

e.preventDefault();

if(resolving)return;

const cell=getCell(e.clientX,e.clientY);

if(!cell)return;

dragging=true;

moved=false;

selected=cell;

createDragGhost(
board[cell.r][cell.c],
e.clientX,
e.clientY
);

renderBoard();

}

function moveDrag(e){

e.preventDefault();

if(!dragging)return;

moveDragGhost(e.clientX,e.clientY);

const cell=getCell(e.clientX,e.clientY);

if(!cell)return;

if(
cell.r===selected.r &&
cell.c===selected.c
)return;

if(!near(selected,cell))return;

if(!moved){

moved=true;

startTimer();

message.textContent="操作中…";

}

swap(selected,cell);

selected=cell;

renderBoard();

}

function endDrag(){

if(!dragging)return;

dragging=false;

selected=null;

stopTimer();

removeDragGhost();

renderBoard();

if(!moved)return;

resolveBoard();

}

function getMatches(){

const mark={};

for(let r=0;r<ROWS;r++){

let count=1;

for(let c=1;c<=COLS;c++){

if(
c<COLS &&
board[r][c] &&
board[r][c]===board[r][c-1]
){
count++;
}else{

if(count>=3){

for(let k=0;k<count;k++){

mark[
r+","+(c-1-k)
]=true;

}

}

count=1;

}

}

}

for(let c=0;c<COLS;c++){

let count=1;

for(let r=1;r<=ROWS;r++){

if(
r<ROWS &&
board[r][c] &&
board[r][c]===board[r-1][c]
){
count++;
}else{

if(count>=3){

for(let k=0;k<count;k++){

mark[
(r-1-k)+","+c
]=true;

}

}

count=1;

}

}

}

return mark;

}

function showComboEffect(combo){

const e=document.createElement("div");

e.className="combo-effect";

e.textContent=combo+"コンボ！";

document.body.appendChild(e);

setTimeout(()=>{
e.remove();
},900);

}

function pop(target,text,cls){

const d=document.createElement("div");

d.className="float "+cls;

d.textContent=text;

target.appendChild(d);

setTimeout(()=>{
d.remove();
},1600);

}

async function resolveBoard(){

resolving=true;

let combo=0;

while(true){

const matched=getMatches();

const keys=Object.keys(matched);

if(!keys.length)break;

combo++;

showComboEffect(combo);

keys.forEach(key=>{

const [r,c]=key.split(",").map(Number);

board[r][c]=null;

});

renderBoard();

await new Promise(r=>setTimeout(r,280));

dropOrbs();

renderBoard();

await new Promise(r=>setTimeout(r,260));

}

if(combo>0){

const damage=Math.floor(
combo*800
);

enemyHp=Math.max(
0,
enemyHp-damage
);

pop(
$("enemyIcon"),
damage,
"damage"
);

updateEnemyHp();

message.textContent=
combo+"コンボ！";

if(enemyHp<=0){

message.textContent=
"撃破！";

setTimeout(()=>{
showResult();
},1000);

}else{

playerHp=Math.max(
0,
playerHp-enemyAtk
);

pop(
$("playerArea"),
"-"+enemyAtk,
"hurt"
);

updatePlayerHp();

}

}else{

message.textContent=
"コンボなし";

}

resolving=false;

}

function dropOrbs(){

for(let c=0;c<COLS;c++){

const remain=[];

for(let r=ROWS-1;r>=0;r--){

if(board[r][c]){

remain.push(board[r][c]);

}

}

while(remain.length<ROWS){

remain.push(
TYPES[
Math.floor(Math.random()*TYPES.length)
]
);

}

for(let r=ROWS-1;r>=0;r--){

board[r][c]=remain[ROWS-1-r];

}

}

}

save.money+=1000;

save.stone+=20;

saveData();

$("resultSummary").innerHTML=
`

`;

const list=$("resultDrops");

list.innerHTML=
`
<div class="drop-row">
★1 モリスライム
</div>
`;

showScreen("result");

}

showScreen("dungeonMenu");

}

}
