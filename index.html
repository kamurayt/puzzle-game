<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>パズルRPG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;font-family:sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.game{width:100%;max-width:430px;height:100svh;padding:6px;display:flex;flex-direction:column;gap:5px}
.screen{display:none;height:100%;flex-direction:column;gap:6px}
.screen.active{display:flex}
.title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad;margin:8px 0}
.card,.status{background:#111827;border-radius:14px;padding:8px}
.status{background:#020617;font-size:12px;line-height:1.5;color:#cbd5e1}
.menu{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:6px}.row button{flex:1}
button{border:0;border-radius:13px;padding:11px;font-size:16px;font-weight:900;background:#eef2ff;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.message{background:#020617;border-radius:11px;min-height:34px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:900;color:#fff3ad}
.enemy-area{display:flex;gap:7px;align-items:center}.enemy{width:50px;height:50px;border-radius:50%;flex-shrink:0;position:relative}
.enemy.hit{animation:hit .2s}@keyframes hit{50%{transform:scale(.82);filter:brightness(2)}}
.enemy-info{flex:1;padding-right:52px;font-size:11px;color:#cbd5e1}.enemy-name{font-size:17px;font-weight:900;color:#fff}
.hp-wrap{height:11px;background:#020617;border-radius:999px;overflow:hidden;margin:3px 0}
.enemy-hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#bef264);transition:.25s}
.top-retreat{position:absolute;right:7px;top:7px;padding:5px 9px;font-size:12px;border-radius:999px;background:#fee2e2;color:#991b1b}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.member{background:#1e293b;border-radius:9px;padding:2px;text-align:center;position:relative}
.member.leader{outline:2px solid #facc15}.member.friend{outline:2px solid #38bdf8}
.role{position:absolute;left:2px;top:2px;background:#020617;border-radius:5px;font-size:8px;padding:1px 3px;color:#fff3ad}
.member .atk{font-size:9px;color:#fde68a;font-weight:900}
.member .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.member .name{font-size:8px}
.player{background:#111827;border-radius:11px;padding:6px;position:relative}
.player.hit{animation:shake .25s}.player.heal{animation:heal .25s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}}@keyframes heal{50%{filter:brightness(1.8)}}
.hp-text{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:3px}
.player-hp-bar{height:11px;background:#020617;border-radius:999px;overflow:hidden}.player-hp-inner{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316,#facc15);transition:.25s}
.buffs{background:#020617;border-radius:9px;padding:5px;font-size:11px;color:#bae6fd;min-height:24px}
.timer{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:900}.timer-wrap{flex:1;height:8px;background:#020617;border-radius:999px;overflow:hidden}.timer-bar{height:100%;width:100%;background:#38bdf8}
.board-wrap{background:#1f2937;border-radius:16px;padding:5px;flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.board{width:100%;height:auto;max-height:100%;aspect-ratio:6/5;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:4px}
.orb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(21px,8vw,34px);font-weight:900;transition:.07s}
.orb.held{opacity:.15;transform:scale(.9)}.orb.clear{opacity:0;transform:scale(.1)}
.drag-orb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,36px);font-weight:900;pointer-events:none;z-index:100;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.float{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;pointer-events:none;animation:floatUp 1.6s forwards;text-shadow:0 2px 4px #000;z-index:50;white-space:nowrap}
.member .float{font-size:14px}.damage{color:#ffe066}.healNum{color:#5dff9d}.hurt{color:#ff7b7b}
@keyframes floatUp{20%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-145%) scale(1)}}
.combo-effect{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fff3ad;text-shadow:0 0 12px #facc15,0 0 24px #f59e0b,0 4px 10px #000;pointer-events:none;z-index:9999;animation:comboAnim .9s forwards}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}}
.fire,.fire-bg{background:radial-gradient(circle at 30% 30%,#ffd4a8,#ef4444)}
.water,.water-bg{background:radial-gradient(circle at 30% 30%,#d7f1ff,#3b82f6)}
.wood,.wood-bg{background:radial-gradient(circle at 30% 30%,#e4ffd8,#22c55e)}
.light,.light-bg{background:radial-gradient(circle at 30% 30%,#fffad1,#facc15);color:#111827}
.dark,.dark-bg{background:radial-gradient(circle at 30% 30%,#f5d0fe,#9333ea)}
.none,.none-bg{background:radial-gradient(circle at 30% 30%,#eee,#64748b)}
.heart{background:radial-gradient(circle at 30% 30%,#ffe4f0,#ec4899)}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.char-row,.drop-row{background:#1e293b;border-radius:10px;padding:8px;font-size:13px}
.char-row{display:flex;justify-content:space-between;align-items:center}
.result-box{background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.result-title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad}.result-item{background:#020617;border-radius:12px;padding:10px;font-size:15px;line-height:1.5}.result-list{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:99999;padding:18px}.modal.active{display:flex}
.modal-box{width:100%;max-width:390px;background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}.modal-title{font-size:20px;font-weight:900;color:#fff3ad}.modal-text{font-size:13px;line-height:1.55;color:#e5e7eb;white-space:pre-wrap}
.gacha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.gacha-card{background:#1e293b;border-radius:9px;padding:6px;text-align:center;font-size:11px}.gacha-card .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;margin-bottom:2px}.rare6{outline:2px solid #facc15}.rare5{outline:2px solid #c084fc}
</style>
</head>
<body>
<div class="game">

<section id="home" class="screen active">
  <div class="title">パズルRPG</div>
  <div class="status" id="homeStatus"></div>
  <div class="menu">
    <button onclick="showScreen('dungeonMenu')">ダンジョン</button>
    <button onclick="showScreen('charMenu')">キャラ</button>
    <button onclick="showScreen('gacha')">ガチャ</button>
  </div>
</section>

<section id="dungeonMenu" class="screen">
  <div class="title">ダンジョン</div>
  <div class="menu">
    <button onclick="startDungeon('normal')">ノーマルダンジョン</button>
    <button onclick="startDungeon('skill')">スキル強化ダンジョン</button>
    <button onclick="startDungeon('awake')">覚醒ダンジョン</button>
    <button onclick="showScreen('home')">戻る</button>
  </div>
</section>

<section id="charMenu" class="screen">
  <div class="title">キャラ一覧</div>
  <div class="row">
    <button onclick="showScreen('home')">戻る</button>
    <button onclick="showScreen('enhance')">強化</button>
  </div>
  <div class="list" id="charList"></div>
</section>

<section id="enhance" class="screen">
  <div class="title">キャラ強化</div>
  <button onclick="showScreen('charMenu')">戻る</button>
  <div class="status">キャラを押すとLv強化・スキル強化できます。</div>
  <div class="list" id="enhanceList"></div>
</section>

<section id="gacha" class="screen">
  <div class="title">ガチャ</div>
  <div class="status">ガチャ石5個で1回 / 50個で10連<br>★2:40% ★3:38% ★4:15% ★5:5% ★6:2%<br>現在のガチャ石：<span id="gachaStoneText">0</span></div>
  <div class="row"><button onclick="doGacha(1)">1回</button><button onclick="doGacha(10)">10連</button></div>
  <div class="list" id="gachaResult"></div>
  <button onclick="showScreen('home')">戻る</button>
</section>

<section id="result" class="screen">
  <div class="result-box">
    <div class="result-title">ダンジョンクリア！</div>
    <div class="result-item" id="resultSummary"></div>
    <div class="result-item"><b>獲得キャラ</b><div class="result-list" id="resultDrops"></div></div>
    <div class="menu"><button onclick="showScreen('home')">ホームへ</button><button onclick="showScreen('dungeonMenu')">ダンジョンへ</button></div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="card">
    <button class="top-retreat" onclick="retreatDungeon()">撤退</button>
    <div class="enemy-area">
      <div class="enemy wood-bg" id="enemyIcon"></div>
      <div class="enemy-info">
        <div class="enemy-name" id="enemyName">敵</div>
        <div><span id="battleTypeText">ノーマル</span> / 階層：<span id="floorText">1</span>/5 / 属性：<span id="enemyAttrText">木</span> / 攻撃：<span id="enemyAtkText">850</span> / 攻撃まで：<span id="enemyTurnText">1</span></div>
        <div class="hp-wrap"><div class="enemy-hp-bar" id="enemyHpBar"></div></div>
        <div>敵HP：<span id="enemyHpText">5000</span>/<span id="enemyMaxHpText">5000</span></div>
      </div>
    </div>
  </div>
  <div class="message" id="message">ドロップを動かしたら操作開始</div>
  <div class="party" id="party"></div>
  <div class="player" id="playerArea">
    <div class="hp-text"><span>味方HP</span><span><span id="playerHpText">0</span>/<span id="playerMaxHpText">0</span></span></div>
    <div class="player-hp-bar"><div class="player-hp-inner" id="playerHpBar"></div></div>
  </div>
  <div class="buffs" id="buffText">効果なし</div>
  <div class="timer"><span>操作 <span id="timerText">5.0</span>秒</span><div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div></div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
</section>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <div class="row" id="modalButtons"></div>
  </div>
</div>

<script>
if(location.search.includes("reset=1")){
  localStorage.removeItem("puzzleRpgSave_v3");
  location.href=location.pathname;
}

const ROWS=5,COLS=6,BASE_MOVE_TIME=5;
const TYPES=["fire","water","wood","light","dark","heart"];

const BG={fire:"fire-bg",water:"water-bg",wood:"wood-bg",light:"light-bg",dark:"dark-bg",none:"none-bg"};
const $=id=>document.getElementById(id);

}

const gachaChars=[
 mk(19,"炎剣士",3,"fire",1100,320,60,{name:"光→火変換",desc:"光を火に変換",kind:"convert",from:"light",to:"fire"},{name:"火攻撃1.5倍",desc:"火属性攻撃1.5倍",kind:"attrAtk",attr:"fire",atk:1.5}),

function leaderModsBase(){return{hp:1,rcv:1,atk:1,move:0,addCombo:0,shield:0}}
function applyLeaderStatic(mod,c){
 let l=c?.ls||noLS;
 if(l.kind==="attrHp")mod.hp*=l.hp;
 if(l.kind==="attrRcv")mod.rcv*=l.rcv;
 if(l.kind==="attrHpRcv"){mod.hp*=l.hp;mod.rcv*=l.rcv}
 if(l.kind==="attrHpAtk")mod.hp*=l.hp;
 if(l.kind==="attrAll"){mod.hp*=l.hp;mod.rcv*=l.rcv}
 if(l.kind==="all"){mod.hp*=l.hp;mod.rcv*=l.rcv;mod.addCombo+=l.addCombo||0}
 if(l.kind==="comboScale"&&l.move)mod.move+=l.move;
 if(l.kind==="flat"){mod.rcv*=l.rcv||1;mod.addCombo+=l.addCombo||0;mod.shield=1-(1-mod.shield)*(1-(l.shield||0))}
}
function calcLeaderHpRcv(){
 let mod=leaderModsBase();
 applyLeaderStatic(mod,party[0]);
 applyLeaderStatic(mod,party[5]);
 playerMaxHp=Math.floor(party.reduce((s,m)=>s+stat(m,"hp"),0)*mod.hp);
 totalRcv=Math.floor(party.reduce((s,m)=>s+stat(m,"rcv"),0)*mod.rcv);
 baseMoveTime=BASE_MOVE_TIME+mod.move;
}
function leaderAtkMultiplier(combo,types){
 let m=1,add=0,shield=0;
 [party[0],party[5]].forEach(c=>{
  let l=c?.ls||noLS;
  if(l.kind==="comboAtk"){if(l.c2&&combo>=l.c2)m*=l.m2;else if(combo>=l.c1)m*=l.m1}
  else if(l.kind==="comboScale"){if(combo>=l.start)m*=Math.min(l.max,1+(combo-l.start+1)*1.5)}
  else if(["attrAtk","attrAtkRcv","attrHpAtk","attrAll"].includes(l.kind))m*=l.atk||1;
  else if(l.kind==="all"){m*=l.atk||1;add+=l.addCombo||0}
  else if(l.kind==="pair"&&types.has(l.a)&&types.has(l.b)){m*=l.atk;add+=l.addCombo||0;shield=1-(1-shield)*(1-(l.shield||0))}
  else if(l.kind==="flat"){m*=l.atk||1;add+=l.addCombo||0;shield=1-(1-shield)*(1-(l.shield||0))}
 });
 return{m,add,shield};
}

function useSkill(c){

 else if(s.kind==="generate"){let spots=[];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)spots.push([r,col]);for(let k=0;k<s.count&&spots.length;k++){let idx=rand(0,spots.length-1),p=spots.splice(idx,1)[0];board[p[0]][p[1]]=s.to}renderBoard()}
 else if(s.kind==="col"){for(let r=0;r<ROWS;r++)board[r][s.col]=s.to;renderBoard()}
 else if(s.kind==="row"){for(let col=0;col<COLS;col++)board[s.row][col]=s.to;renderBoard()}
 else if(s.kind==="board"){for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)board[r][col]=s.types[rand(0,s.types.length-1)];renderBoard()}
 else if(s.kind==="shield")addBuff({kind:"shield",rate:s.rate,label:`軽減${Math.round(s.rate*100)}%`});
 else if(s.kind==="moveTime")addBuff({kind:"move",plus:s.plus,label:`操作+${s.plus}秒`});
 else if(s.kind==="buffAtk")addBuff({kind:"atk",mult:s.mult,label:`全攻撃${s.mult}倍`});
 else if(s.kind==="buffRcv")addBuff({kind:"rcv",mult:s.mult,label:`全回復${s.mult}倍`});

 else if(s.kind==="buffAtkCombo")addBuff({kind:"atkCombo",mult:s.mult,addCombo:s.addCombo,label:`攻撃${s.mult}倍+${s.addCombo}コンボ`});
 else if(s.kind==="buffAtkRcv")addBuff({kind:"atkRcv",mult:s.mult,label:`攻撃回復${s.mult}倍`});

function createBoard(){board=[];for(let r=0;r<ROWS;r++){let row=[];for(let c=0;c<COLS;c++)row.push(randomType());board.push(row)}renderBoard()}
function renderBoard(){boardEl.innerHTML="";for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let o=document.createElement("div");o.className="orb "+board[r][c];o.textContent=ICONS[board[r][c]];if(selected&&selected.r===r&&selected.c===c&&dragging)o.classList.add("held");boardEl.appendChild(o)}}
function getCell(x,y){let rect=boardEl.getBoundingClientRect(),cw=rect.width/COLS,ch=rect.height/ROWS,c=Math.floor((x-rect.left)/cw),r=Math.floor((y-rect.top)/ch);if(r<0||c<0||r>=ROWS||c>=COLS)return null;return{r,c}}
function getCellSize(){let rect=boardEl.getBoundingClientRect(),size=Math.min(rect.width/COLS-4,rect.height/ROWS-4);return{w:size,h:size}}
function createDragGhost(type,x,y){removeDragGhost();let size=getCellSize();dragGhost=document.createElement("div");dragGhost.className="drag-orb "+type;dragGhost.textContent=ICONS[type];dragGhost.style.width=size.w+"px";dragGhost.style.height=size.h+"px";boardWrap.appendChild(dragGhost);moveDragGhost(x,y)}
function moveDragGhost(x,y){if(!dragGhost)return;let rect=boardWrap.getBoundingClientRect();dragGhost.style.left=(x-rect.left)+"px";dragGhost.style.top=(y-rect.top)+"px"}
function removeDragGhost(){if(dragGhost){dragGhost.remove();dragGhost=null}}
function swap(a,b){let t=board[a.r][a.c];board[a.r][a.c]=board[b.r][b.c];board[b.r][b.c]=t}
function isNear(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function currentMoveTime(){return baseMoveTime+activeBuffs.filter(b=>b.kind==="move").reduce((s,b)=>s+b.plus,0)}
function startTimer(){stopTimer();let mt=currentMoveTime(),start=performance.now();timerId=setInterval(()=>{let left=Math.max(0,mt-(performance.now()-start)/1000);timerText.textContent=left.toFixed(1);timerBar.style.width=(left/mt*100)+"%";if(left<=0)endDrag()},50)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startDrag(e){e.preventDefault();if(resolving||playerHp<=0||enemyHp<=0)return;let cell=getCell(e.clientX,e.clientY);if(!cell)return;dragging=true;movedOnce=false;selected=cell;heldType=board[cell.r][cell.c];createDragGhost(heldType,e.clientX,e.clientY);renderBoard()}
function moveOneStep(next){if(!selected||!next)return false;if(next.r<0||next.c<0||next.r>=ROWS||next.c>=COLS)return false;if(!isNear(selected,next))return false;if(!movedOnce){movedOnce=true;startTimer();message.textContent="操作中…"}swap(selected,next);selected=next;return true}
function moveDrag(e){e.preventDefault();if(!dragging||!selected||resolving)return;moveDragGhost(e.clientX,e.clientY);let cell=getCell(e.clientX,e.clientY);if(!cell||(cell.r===selected.r&&cell.c===selected.c))return;let dr=cell.r-selected.r,dc=cell.c-selected.c,sr=Math.sign(dr),sc=Math.sign(dc),changed=false;if(Math.abs(dc)>=Math.abs(dr)){if(sc)changed=moveOneStep({r:selected.r,c:selected.c+sc})||changed;if(sr)changed=moveOneStep({r:selected.r+sr,c:selected.c})||changed}else{if(sr)changed=moveOneStep({r:selected.r+sr,c:selected.c})||changed;if(sc)changed=moveOneStep({r:selected.r,c:selected.c+sc})||changed}if(changed)renderBoard()}
function endDrag(e){if(e)e.preventDefault();if(!dragging)return;dragging=false;selected=null;heldType=null;stopTimer();removeDragGhost();renderBoard();if(!movedOnce)return;resolveBoard()}

function getMatchedMap(){let map={};for(let r=0;r<ROWS;r++){let count=1;for(let c=1;c<=COLS;c++){if(c<COLS&&board[r][c]&&board[r][c]===board[r][c-1])count++;else{if(count>=3)for(let k=0;k<count;k++)map[r+","+(c-1-k)]=true;count=1}}}for(let c=0;c<COLS;c++){let count=1;for(let r=1;r<=ROWS;r++){if(r<ROWS&&board[r][c]&&board[r][c]===board[r-1][c])count++;else{if(count>=3)for(let k=0;k<count;k++)map[(r-1-k)+","+c]=true;count=1}}}return map}
function getGroups(){let matched=getMatchedMap(),visited={},groups=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];Object.keys(matched).forEach(key=>{if(visited[key])return;let [sr,sc]=key.split(",").map(Number),type=board[sr][sc],stack=[{r:sr,c:sc}],cells=[];visited[key]=true;while(stack.length){let cur=stack.pop();cells.push(cur);dirs.forEach(([dr,dc])=>{let nr=cur.r+dr,nc=cur.c+dc,nk=nr+","+nc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS||!matched[nk]||visited[nk]||board[nr][nc]!==type)return;visited[nk]=true;stack.push({r:nr,c:nc})})}groups.push({type,cells,count:cells.length})});return groups}
function showComboEffect(combo){let e=document.createElement("div");e.className="combo-effect";e.textContent=combo+"コンボ！";document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
async function resolveBoard(){resolving=true;let combo=0,cleared=[];while(true){let groups=getGroups();if(!groups.length)break;for(let g of groups){combo++;showComboEffect(combo);cleared.push({...g,combo});message.textContent=combo+"コンボ！ "+JP[g.type]+"を"+g.count+"個消した";markClear(g.cells);await sleep(300);g.cells.forEach(cell=>board[cell.r][cell.c]=null);renderBoard();await sleep(100)}dropOrbs();renderBoard();await sleep(300)}if(combo===0){message.textContent="コンボなし";enemyAttack();resolving=false;return}let result=calcDamage(cleared,combo);applyResult(result);await sleep(900);if(enemyHp<=0)floorClear();else enemyAttack();consumeBuffs();resolving=false}
function markClear(cells){let orbs=[...boardEl.children];cells.forEach(cell=>{let i=cell.r*COLS+cell.c;if(orbs[i])orbs[i].classList.add("clear")})}
function dropOrbs(){for(let c=0;c<COLS;c++){let remain=[];for(let r=ROWS-1;r>=0;r--)if(board[r][c])remain.push(board[r][c]);while(remain.length<ROWS)remain.push(randomType());for(let r=ROWS-1;r>=0;r--)board[r][c]=remain[ROWS-1-r]}}

function comboMul(combo){return 1+(combo-1)*.25}
function orbMul(count){return 1+(count-3)*.25}
function attrRate(a,d){if(a==="fire"&&d==="wood")return 2;if(a==="fire"&&d==="water")return .5;if(a==="water"&&d==="fire")return 2;if(a==="water"&&d==="wood")return .5;if(a==="wood"&&d==="water")return 2;if(a==="wood"&&d==="fire")return .5;if(a==="light"&&d==="dark")return 2;if(a==="dark"&&d==="light")return 2;return 1}
function calcDamage(groups,combo){let heal=0,memberDamage={},types=new Set(groups.map(g=>g.type)),lm=leaderAtkMultiplier(combo,types),realCombo=combo+lm.add,cm=comboMul(realCombo);groups.forEach(g=>{let om=orbMul(g.count);if(g.type==="heart"){let rcvBuff=activeBuffs.reduce((s,b)=>s*(b.kind==="rcv"||b.kind==="atkRcv"?b.mult:1),1);heal+=Math.floor(totalRcv*om*cm*rcvBuff);return}party.forEach((m,index)=>{if(m.attr!==g.type)return;let buff=activeBuffs.reduce((s,b)=>s*(b.kind==="atk"||b.kind==="atkRcv"||b.kind==="atkCombo"?b.mult:(b.kind==="attrAtk"&&b.attr===m.attr?b.mult:1)),1);let damage=Math.floor(stat(m,"atk")*om*cm*lm.m*buff*attrRate(m.attr,enemyAttr));memberDamage[index]=(memberDamage[index]||0)+damage})});return{memberDamage,heal,lm,combo:realCombo}}
function applyResult(res){if(res.heal>0){playerHp=Math.min(playerMaxHp,playerHp+res.heal);pop(playerArea,"+"+res.heal,"healNum");flash(playerArea,"heal")}let totalDamage=0;party.forEach((m,index)=>{let damage=res.memberDamage[index]||0;totalDamage+=damage;let card=partyEl.children[index];if(damage>0&&card)pop(card,damage,"damage")});if(totalDamage>0){enemyHp=Math.max(0,enemyHp-totalDamage);pop(enemyIcon,totalDamage,"damage");flash(enemyIcon,"hit")}updateHp();let text=res.combo+"コンボ！ "+totalDamage+"ダメージ！";if(res.heal>0)text+=" HP"+res.heal+"回復！";if(res.lm.m>1)text+=" LS"+res.lm.m.toFixed(1)+"倍！";if(enemyHp<=0)text+=" 撃破！";message.textContent=text}
function enemyAttack(){if(enemyHp<=0||playerHp<=0)return;enemyTurn--;if(enemyTurn<=0){let shield=activeBuffs.reduce((s,b)=>1-(1-s)*(1-(b.kind==="shield"?b.rate:0)),0),lm=leaderAtkMultiplier(0,new Set());shield=1-(1-shield)*(1-(lm.shield||0));let dmg=Math.floor(enemyAtk*(1-shield));playerHp=Math.max(0,playerHp-dmg);enemyTurn=enemyTurnMax;pop(playerArea,"-"+dmg,"hurt");flash(playerArea,"hit");updateHp();if(playerHp<=0){tempDrops=[];tempStone=0;message.textContent="ゲームオーバー… 仮獲得は全て没収"}else message.textContent+=" / 敵の攻撃！"+dmg+"ダメージ"}enemyTurnText.textContent=enemyTurn}

function floorClear(){let floor=floors[floorIndex];if(Math.random()<(floor.dropRate??1)){tempDrops.push(floor.drop);message.textContent+=" / "+(floor.drop.name||"キャラ")+"がドロップ！"}let key=currentType==="normal"?"normal_"+normalNo:currentType,first=!save.cleared[key];if(!first&&Math.random()<(floor.gachaRate??.35)){tempStone++;message.textContent+=" / ガチャ石+1"}setTimeout(()=>{if(floorIndex>=floors.length-1)clearDungeon(key,first);else{floorIndex++;setEnemy();message.textContent="次の階層へ！"}},900)}
function clearDungeon(key,first){let money=currentType==="normal"?rand(500+normalNo*80,1000+normalNo*120):rand(300,700),stone=first?20:tempStone,gotDrops=[...tempDrops];save.money+=money;save.stone+=stone;gotDrops.forEach(addOwned);save.cleared[key]=true;if(currentType==="normal"&&normalNo>save.clearedNormal)save.clearedNormal=normalNo;saveData();lastResult={money,stone,drops:gotDrops,first,type:currentType};tempDrops=[];tempStone=0;updateHome();showResult()}
function showResult(){let r=lastResult;$("resultSummary").innerHTML=`獲得ゴールド：+${r.money}<br>獲得ガチャ石：+${r.stone}${r.first?"（初回クリアボーナス）":""}<br>獲得キャラ：${r.drops.length}体`;let list=$("resultDrops");list.innerHTML="";if(r.drops.length===0){let none=document.createElement("div");none.className="drop-row";none.textContent="なし";list.appendChild(none)}else r.drops.forEach(d=>{let row=document.createElement("div");row.className="drop-row";row.textContent=`★${d.rarity||1} No.${d.no} ${d.name||"キャラ"} / ${JP[d.attr]||d.attr}`;list.appendChild(row)});showScreen("result")}
function retreatDungeon(){tempDrops=[];tempStone=0;activeBuffs=[];message.textContent="撤退したため、仮獲得は全て没収";showScreen("dungeonMenu")}
function setEnemy(){let e=floors[floorIndex];enemyMaxHp=e.hp;enemyHp=e.hp;enemyAttr=e.attr;enemyAtk=e.atk;enemyTurnMax=e.turn;enemyTurn=e.turn;enemyName.textContent=e.name;enemyAttrText.textContent=JP[e.attr];enemyAtkText.textContent=e.atk;enemyIcon.className="enemy "+BG[e.attr];floorText.textContent=floorIndex+1;updateHp()}
function updateHp(){enemyHpText.textContent=enemyHp;enemyMaxHpText.textContent=enemyMaxHp;enemyHpBar.style.width=(enemyHp/enemyMaxHp*100)+"%";playerHpText.textContent=playerHp;playerMaxHpText.textContent=playerMaxHp;playerHpBar.style.width=(playerHp/playerMaxHp*100)+"%";enemyTurnText.textContent=enemyTurn}

boardEl.addEventListener("pointerdown",startDrag);
window.addEventListener("pointermove",moveDrag);
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);

renderParty();
updateHome();
</script>
</body>
