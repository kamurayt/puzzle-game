<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>パズルRPG</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0f172a;
  font-family:sans-serif;
  color:white;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:430px;
  height:100svh;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.enemy-panel{
  background:#111827;
  border-radius:15px;
  padding:8px;
}

.enemy-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.enemy{
  width:58px;
  height:58px;
  border-radius:50%;
  flex-shrink:0;
  position:relative;
}

.enemy.hit{
  animation:enemyHit 0.18s;
}

@keyframes enemyHit{
  0%{transform:scale(1);}
  50%{transform:scale(0.84);filter:brightness(2);}
  100%{transform:scale(1);}
}

.enemy-name{
  font-size:18px;
  font-weight:bold;
}

.enemy-info{
  flex:1;
}

.enemy-small{
  font-size:12px;
  color:#cbd5e1;
  margin-top:2px;
}

.hp-wrap{
  width:100%;
  height:12px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
  margin-top:4px;
}

.enemy-hp-bar{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#22c55e,#bef264);
  transition:0.25s;
}

.message{
  background:#020617;
  border-radius:12px;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff3ad;
  font-size:16px;
  font-weight:bold;
  padding:7px;
}

.party{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

.member{
  background:#1e293b;
  border-radius:10px;
  padding:3px;
  text-align:center;
}

.member .atk{
  font-size:10px;
  color:#fde68a;
  font-weight:bold;
}

.member .icon{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:bold;
  margin-top:2px;
}

.member .name{
  font-size:9px;
  margin-top:2px;
}

.player-hp-area{
  background:#111827;
  border-radius:12px;
  padding:7px;
  position:relative;
}

.player-hp-area.hit{
  animation:playerHit 0.25s;
}

.player-hp-area.heal{
  animation:playerHeal 0.25s;
}

@keyframes playerHit{
  0%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  50%{transform:translateX(4px);}
  100%{transform:translateX(0);}
}

@keyframes playerHeal{
  0%{filter:brightness(1);}
  50%{filter:brightness(1.7);}
  100%{filter:brightness(1);}
}

.player-hp-text{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  font-weight:bold;
  margin-bottom:4px;
}

.player-hp-bar{
  width:100%;
  height:12px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
}

.player-hp-inner{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#ef4444,#f97316,#facc15);
  transition:0.25s;
}

.timer-row{
  display:flex;
  gap:6px;
  align-items:center;
  font-size:13px;
  font-weight:bold;
}

.timer-bar-wrap{
  flex:1;
  height:9px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
}

.timer-bar{
  width:100%;
  height:100%;
  background:#38bdf8;
}

.board-wrap{
  background:#1f2937;
  border-radius:18px;
  padding:6px;
  flex:1;
  display:flex;
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

.orb{
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(22px,8vw,34px);
  font-weight:bold;
  transition:transform 0.03s linear, opacity 0.12s;
}

.selected{
  transform:scale(1.02);
}

.clear{
  opacity:0;
  transform:scale(0.1);
}

.fire,.fire-bg{
  background:radial-gradient(circle at 30% 30%, #ffd4a8, #ef4444);
}

.water,.water-bg{
  background:radial-gradient(circle at 30% 30%, #d7f1ff, #3b82f6);
}

.wood,.wood-bg{
  background:radial-gradient(circle at 30% 30%, #e4ffd8, #22c55e);
}

.light,.light-bg{
  background:radial-gradient(circle at 30% 30%, #fffad1, #facc15);
  color:#111827;
}

.dark,.dark-bg{
  background:radial-gradient(circle at 30% 30%, #f5d0fe, #9333ea);
}

.heart{
  background:radial-gradient(circle at 30% 30%, #ffe4f0, #ec4899);
}

.float-number{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:24px;
  font-weight:900;
  pointer-events:none;
  animation:floatUp 0.9s forwards;
  text-shadow:0 2px 4px rgba(0,0,0,0.8);
}

.float-damage{
  color:#ffe066;
}

.float-heal{
  color:#5dff9d;
}

.float-player{
  color:#ff7b7b;
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translate(-50%,-20%) scale(0.7);
  }
  20%{
    opacity:1;
    transform:translate(-50%,-60%) scale(1.1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-140%) scale(1);
  }
}
</style>
</head>

<body>

<div class="game">

<div class="enemy-panel">
<div class="enemy-area">

<div class="enemy wood-bg" id="enemyIcon"></div>

<div class="enemy-info">

<div class="enemy-name">
モリスライム
</div>

<div class="enemy-small">
属性：木 / 攻撃：850 / 攻撃まで：1
</div>

<div class="hp-wrap">
<div class="enemy-hp-bar" id="enemyHpBar"></div>
</div>

<div class="enemy-small">
敵HP：
<span id="enemyHpText">5000</span>
/
5000
</div>

</div>
</div>
</div>

<div class="message" id="message">
ドロップを動かしたら5秒開始
</div>

<div class="party" id="party"></div>

<div class="player-hp-area" id="playerHpArea">

<div class="player-hp-text">
<span>味方HP</span>
<span>
<span id="playerHpText">5550</span>
/
5550
</span>
</div>

<div class="player-hp-bar">
<div class="player-hp-inner" id="playerHpBar"></div>
</div>

</div>

<div class="timer-row">
<span>
操作時間
<span id="timerText">5.0</span>
秒
</span>

<div class="timer-bar-wrap">
<div class="timer-bar" id="timerBar"></div>
</div>
</div>

<div class="board-wrap">
<div class="board" id="board"></div>
</div>

</div>

<script>

const ROWS = 5;
const COLS = 6;
const MOVE_TIME = 5;

const TYPES = [
"fire",
"water",
"wood",
"light",
"dark",
"heart"
];

const ICONS = {
fire:"火",
water:"水",
wood:"木",
light:"光",
dark:"闇",
heart:"♡"
};

const JP = {
fire:"火",
water:"水",
wood:"木",
light:"光",
dark:"闇",
heart:"回復"
};

const members = [
{no:1,attr:"fire",hp:500,atk:150,rcv:15},
{no:2,attr:"water",hp:1500,atk:50,rcv:45},
{no:3,attr:"wood",hp:1000,atk:100,rcv:30},
{no:4,attr:"dark",hp:750,atk:180,rcv:0},
{no:5,attr:"light",hp:1200,atk:100,rcv:50},
{no:6,attr:"fire",hp:600,atk:130,rcv:25}
];

let board = [];
let dragging = false;
let selected = null;
let movedOnce = false;
let timerId = null;
let resolving = false;

let playerMaxHp =
members.reduce((s,m)=>s+m.hp,0);

let playerHp = playerMaxHp;

let totalRcv =
members.reduce((s,m)=>s+m.rcv,0);

let enemyHp = 5000;

const boardEl =
document.getElementById("board");

const enemyHpBar =
document.getElementById("enemyHpBar");

const enemyHpText =
document.getElementById("enemyHpText");

const playerHpBar =
document.getElementById("playerHpBar");

const playerHpText =
document.getElementById("playerHpText");

const playerHpArea =
document.getElementById("playerHpArea");

const timerText =
document.getElementById("timerText");

const timerBar =
document.getElementById("timerBar");

const message =
document.getElementById("message");

const enemyIcon =
document.getElementById("enemyIcon");

function randomType(){
return TYPES[
Math.floor(Math.random()*TYPES.length)
];
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

function popNumber(
target,
text,
className
){
const div =
document.createElement("div");

div.className =
"float-number " + className;

div.innerText = text;

target.appendChild(div);

setTimeout(()=>div.remove(),900);
}

function renderParty(){

const party =
document.getElementById("party");

party.innerHTML = "";

for(const m of members){

const div =
document.createElement("div");

div.className = "member";

div.innerHTML = `
<div class="atk">
攻 ${m.atk}
</div>

<div class="icon ${m.attr}-bg">
${JP[m.attr]}
</div>

<div class="name">
No.${m.no}
</div>
`;

party.appendChild(div);

}

}

function createBoard(){

board = [];

for(let r=0;r<ROWS;r++){

const row = [];

for(let c=0;c<COLS;c++){

row.push(randomType());

}

board.push(row);

}

renderBoard();

}

function renderBoard(){

boardEl.innerHTML = "";

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

const orb =
document.createElement("div");

orb.className =
"orb " + board[r][c];

orb.innerText =
ICONS[board[r][c]];

if(
selected &&
selected.r===r &&
selected.c===c
){
orb.classList.add("selected");
}

boardEl.appendChild(orb);

}

}

}

function getCell(x,y){

const rect =
boardEl.getBoundingClientRect();

const cellW =
rect.width / COLS;

const cellH =
rect.height / ROWS;

const c =
Math.floor((x-rect.left)/cellW);

const r =
Math.floor((y-rect.top)/cellH);

if(
r<0 || c<0 ||
r>=ROWS || c>=COLS
){
return null;
}

return {r,c};

}

function swap(a,b){

const t =
board[a.r][a.c];

board[a.r][a.c] =
board[b.r][b.c];

board[b.r][b.c] = t;

}

function isNear(a,b){

return (
Math.abs(a.r-b.r)+
Math.abs(a.c-b.c)
)===1;

}

function startTimer(){

stopTimer();

let start =
performance.now();

timerId = setInterval(()=>{

const passed =
(performance.now()-start)/1000;

const left =
Math.max(
0,
MOVE_TIME-passed
);

timerText.innerText =
left.toFixed(1);

timerBar.style.width =
(left/MOVE_TIME*100)+"%";

if(left<=0){
endDrag();
}

},50);

}

function stopTimer(){

if(timerId){

clearInterval(timerId);

timerId = null;

}

}

function startDrag(e){

if(resolving) return;

const cell =
getCell(e.clientX,e.clientY);

if(!cell) return;

dragging = true;

selected = cell;

movedOnce = false;

renderBoard();

}

function moveDrag(e){

if(
!dragging ||
!selected ||
resolving
) return;

const cell =
getCell(e.clientX,e.clientY);

if(!cell) return;

const dr =
cell.r - selected.r;

const dc =
cell.c - selected.c;

if(
Math.abs(dr)+
Math.abs(dc)===1
){

if(!movedOnce){

movedOnce = true;

startTimer();

message.innerText =
"操作中…";

}

swap(selected,cell);

selected = cell;

renderBoard();

}

}

function endDrag(){

if(!dragging) return;

dragging = false;

selected = null;

stopTimer();

renderBoard();

if(!movedOnce){
return;
}

resolveBoard();

}

function getMatches(){

const map = {};

for(let r=0;r<ROWS;r++){

let count = 1;

for(let c=1;c<=COLS;c++){

if(
c<COLS &&
board[r][c]===
board[r][c-1]
){
count++;
}else{

if(count>=3){

for(let k=0;k<count;k++){

map[
r+","+(c-1-k)
]=true;

}

}

count=1;

}

}

}

for(let c=0;c<COLS;c++){

let count = 1;

for(let r=1;r<=ROWS;r++){

if(
r<ROWS &&
board[r][c]===
board[r-1][c]
){
count++;
}else{

if(count>=3){

for(let k=0;k<count;k++){

map[
(r-1-k)+","+c
]=true;

}

}

count=1;

}

}

}

return Object.keys(map);

}

async function resolveBoard(){

resolving = true;

let combo = 0;

while(true){

const matches =
getMatches();

if(matches.length<=0){
break;
}

combo++;

message.innerText =
combo + "コンボ！";

for(const key of matches){

const parts =
key.split(",");

const r =
Number(parts[0]);

const c =
Number(parts[1]);

const index =
r*COLS+c;

boardEl.children[index]
.classList.add("clear");

}

await sleep(180);

for(const key of matches){

const parts =
key.split(",");

const r =
Number(parts[0]);

const c =
Number(parts[1]);

board[r][c] = null;

}

dropOrbs();

renderBoard();

await sleep(220);

}

if(combo>0){

let damage =
Math.floor(combo*850);

enemyHp =
Math.max(0,enemyHp-damage);

enemyHpText.innerText =
enemyHp;

enemyHpBar.style.width =
(enemyHp/5000*100)+"%";

enemyIcon.classList.add("hit");

setTimeout(()=>{
enemyIcon.classList.remove("hit");
},180);

popNumber(
enemyIcon,
damage,
"float-damage"
);

message.innerText =
combo +
"コンボ！ " +
damage +
"ダメージ！";

if(enemyHp<=0){

message.innerText =
"敵を倒した！";

}

}else{

message.innerText =
"コンボなし";

}

await sleep(500);

if(enemyHp>0){

playerHp =
Math.max(
0,
playerHp-850
);

playerHpText.innerText =
playerHp;

playerHpBar.style.width =
(playerHp/playerMaxHp*100)
+"%";

playerHpArea.classList.add("hit");

setTimeout(()=>{
playerHpArea
.classList.remove("hit");
},250);

popNumber(
playerHpArea,
"-850",
"float-player"
);

message.innerText +=
" 敵の攻撃！";

}

resolving = false;

}

function dropOrbs(){

for(let c=0;c<COLS;c++){

const remain = [];

for(let r=ROWS-1;r>=0;r--){

if(board[r][c]){

remain.push(board[r][c]);

}

}

while(remain.length<ROWS){

remain.push(randomType());

}

for(let r=ROWS-1;r>=0;r--){

board[r][c] =
remain[ROWS-1-r];

}

}

}

boardEl.addEventListener(
"pointerdown",
startDrag
);

window.addEventListener(
"pointermove",
moveDrag
);

window.addEventListener(
"pointerup",
endDrag
);

renderParty();
createBoard();

</script>

</body>
</html>
