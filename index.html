<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>パズルRPG</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#111827;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.game{
  width:100%;
  max-width:430px;
  padding:14px;
}

.panel{
  background:#1f2937;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
}

.enemy{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:auto;
  background:radial-gradient(circle at 30% 30%, #ffb6d9, #9333ea);
  box-shadow:0 0 20px #ff4fa3;
}

.enemy-name{
  text-align:center;
  font-size:32px;
  margin-top:10px;
  font-weight:bold;
}

.hp-wrap{
  width:100%;
  height:18px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  margin-top:16px;
}

.hp-bar{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#22c55e,#d9ff3f);
  transition:0.3s;
}

.info{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  font-size:22px;
}

.message{
  background:#0f172a;
  padding:16px;
  border-radius:16px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin-bottom:14px;
  color:#fff2b0;
}

.board-wrap{
  background:#1f2937;
  padding:8px;
  border-radius:24px;
  touch-action:none;
}

.board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.orb{
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:bold;
  color:white;
  transition:0.1s;
}

.selected{
  transform:scale(1.15);
  outline:4px solid white;
}

.fire{
  background:radial-gradient(circle at 30% 30%, #ffd4a8, #ef4444);
}

.water{
  background:radial-gradient(circle at 30% 30%, #d7f1ff, #3b82f6);
}

.wood{
  background:radial-gradient(circle at 30% 30%, #e4ffd8, #22c55e);
}

.light{
  background:radial-gradient(circle at 30% 30%, #fffad1, #facc15);
}

.dark{
  background:radial-gradient(circle at 30% 30%, #f5d0fe, #9333ea);
}

.heart{
  background:radial-gradient(circle at 30% 30%, #ffe4f0, #ec4899);
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:14px;
}

button{
  flex:1;
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

  <div class="panel">

    <div class="enemy"></div>

    <div class="enemy-name">
      まじっくスライム
    </div>

    <div class="hp-wrap">
      <div class="hp-bar" id="hpBar"></div>
    </div>

    <div class="info">
      <div>
        HP : <span id="hpText">3000</span>
      </div>

      <div>
        コンボ : <span id="comboText">0</span>
      </div>
    </div>

  </div>

  <div class="message" id="message">
    指でドロップを動かそう
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="buttons">
    <button onclick="resetGame()">
      リセット
    </button>

    <button onclick="healEnemy()">
      敵復活
    </button>
  </div>

</div>

<script>

const ROWS = 5;
const COLS = 6;

const TYPES = [
  "fire",
  "water",
  "wood",
  "light",
  "dark",
  "heart"
];

const ICONS = {
  fire:"火",
  water:"水",
  wood:"木",
  light:"光",
  dark:"闇",
  heart:"♡"
};

let board = [];

let dragging = false;

let selected = null;

let enemyHp = 3000;

const boardEl = document.getElementById("board");

const hpBar = document.getElementById("hpBar");

const hpText = document.getElementById("hpText");

const comboText = document.getElementById("comboText");

const message = document.getElementById("message");

function randomType(){
  return TYPES[Math.floor(Math.random()*TYPES.length)];
}

function createBoard(){

  board = [];

  for(let r=0;r<ROWS;r++){

    let row = [];

    for(let c=0;c<COLS;c++){

      row.push(randomType());

    }

    board.push(row);

  }

  renderBoard();

}

function renderBoard(){

  boardEl.innerHTML = "";

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      const orb = document.createElement("div");

      orb.className = "orb " + board[r][c];

      orb.innerText = ICONS[board[r][c]];

      orb.dataset.row = r;

      orb.dataset.col = c;

      if(
        selected &&
        selected.r == r &&
        selected.c == c
      ){
        orb.classList.add("selected");
      }

      boardEl.appendChild(orb);

    }

  }

}

function getCell(x,y){

  const rect = boardEl.getBoundingClientRect();

  const cellWidth = rect.width / COLS;

  const cellHeight = rect.height / ROWS;

  const c = Math.floor((x - rect.left)/cellWidth);

  const r = Math.floor((y - rect.top)/cellHeight);

  if(r < 0 || c < 0 || r >= ROWS || c >= COLS){
    return null;
  }

  return {r,c};

}

function swap(a,b){

  let temp = board[a.r][a.c];

  board[a.r][a.c] = board[b.r][b.c];

  board[b.r][b.c] = temp;

}

function isNear(a,b){

  return (
    Math.abs(a.r-b.r) +
    Math.abs(a.c-b.c)
  ) == 1;

}

function startDrag(e){

  dragging = true;

  const touch = e.touches ? e.touches[0] : e;

  selected = getCell(touch.clientX,touch.clientY);

  renderBoard();

}

function moveDrag(e){

  if(!dragging || !selected){
    return;
  }

  const touch = e.touches ? e.touches[0] : e;

  const cell = getCell(
    touch.clientX,
    touch.clientY
  );

  if(!cell){
    return;
  }

  if(isNear(selected,cell)){

    swap(selected,cell);

    selected = cell;

    renderBoard();

  }

}

function endDrag(){

  dragging = false;

  selected = null;

  renderBoard();

  checkMatches();

}

function checkMatches(){

  let combo = 0;

  let remove = [];

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS-2;c++){

      const t = board[r][c];

      if(
        t == board[r][c+1] &&
        t == board[r][c+2]
      ){

        remove.push([r,c]);
        remove.push([r,c+1]);
        remove.push([r,c+2]);

      }

    }

  }

  for(let c=0;c<COLS;c++){

    for(let r=0;r<ROWS-2;r++){

      const t = board[r][c];

      if(
        t == board[r+1][c] &&
        t == board[r+2][c]
      ){

        remove.push([r,c]);
        remove.push([r+1,c]);
        remove.push([r+2,c]);

      }

    }

  }

  if(remove.length <= 0){

    message.innerText = "コンボなし";

    comboText.innerText = "0";

    return;

  }

  combo = Math.floor(remove.length / 3);

  comboText.innerText = combo;

  let damage = combo * 300;

  enemyHp -= damage;

  if(enemyHp < 0){
    enemyHp = 0;
  }

  hpText.innerText = enemyHp;

  hpBar.style.width =
    (enemyHp / 3000 * 100) + "%";

  message.innerText =
    combo + "コンボ！ " +
    damage + "ダメージ！";

  for(let pos of remove){

    board[pos[0]][pos[1]] =
      randomType();

  }

  renderBoard();

  if(enemyHp <= 0){

    message.innerText =
      "敵を倒した！";

  }

}

function resetGame(){

  enemyHp = 3000;

  hpText.innerText = enemyHp;

  hpBar.style.width = "100%";

  comboText.innerText = "0";

  message.innerText =
    "指でドロップを動かそう";

  createBoard();

}

function healEnemy(){

  enemyHp = 3000;

  hpText.innerText = enemyHp;

  hpBar.style.width = "100%";

  message.innerText =
    "敵が復活した！";

}

boardEl.addEventListener(
  "pointerdown",
  startDrag
);

window.addEventListener(
  "pointermove",
  moveDrag
);

window.addEventListener(
  "pointerup",
  endDrag
);

window.addEventListener(
  "pointercancel",
  endDrag
);

resetGame();

</script>

</body>
</html>
