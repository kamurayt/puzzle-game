<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>パズルRPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;font-family:sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.game{width:100%;max-width:430px;height:100svh;padding:7px;display:flex;flex-direction:column;gap:6px}
.screen{display:none;height:100%;flex-direction:column;gap:7px}.screen.active{display:flex}
.title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad;margin:6px 0}
button,select{border:0;border-radius:13px;padding:11px;font-size:16px;font-weight:900;background:#eef2ff;color:#111827}
select{width:100%}
.menu{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:6px}.row button{flex:1}
.card,.status{background:#111827;border-radius:14px;padding:9px}
.status{background:#020617;font-size:12px;line-height:1.5;color:#cbd5e1}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px}
.char-row,.drop-row{background:#1e293b;border-radius:10px;padding:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent}
.char-row.in-party{outline:2px solid #fff3ad;background:#293548}
.enemy-area{display:flex;gap:7px;align-items:center}
.enemy{width:50px;height:50px;border-radius:50%;position:relative;flex-shrink:0}
.enemy-info{flex:1;font-size:11px;color:#cbd5e1;padding-right:54px}
.enemy-name{font-size:17px;color:white;font-weight:900}
.gimmick{margin-top:4px;font-size:11px;line-height:1.35;color:#fef3c7}
.hp-wrap{height:11px;background:#020617;border-radius:999px;overflow:hidden;margin:3px 0}
.enemy-hp-bar{height:100%;background:linear-gradient(90deg,#22c55e,#bef264);width:100%;transition:.25s}
.top-retreat{position:absolute;right:7px;top:7px;padding:5px 9px;font-size:12px;border-radius:999px;background:#fee2e2;color:#991b1b}
.message{background:#020617;border-radius:11px;min-height:34px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:900;color:#fff3ad}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.member{background:#1e293b;border-radius:9px;padding:2px;text-align:center;position:relative;border:2px solid transparent}
.member.leader{outline:2px solid #facc15}.member.friend{outline:2px solid #38bdf8}
.role{position:absolute;left:2px;top:2px;background:#020617;border-radius:5px;font-size:8px;padding:1px 3px;color:#fff3ad;z-index:2}
.cd{position:absolute;right:2px;top:2px;background:#020617;border-radius:5px;font-size:8px;padding:1px 3px;color:#bae6fd;z-index:2}
.member .atk{font-size:9px;color:#fde68a;font-weight:900}
.member .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.member .name{font-size:8px}
.icon-img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;background:#020617}
.detail-img{width:120px;height:120px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 8px;background:#020617}
.player{background:#111827;border-radius:11px;padding:6px;position:relative}
.hp-text{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:3px}
.player-hp-bar{height:11px;background:#020617;border-radius:999px;overflow:hidden}
.player-hp-inner{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316,#facc15);transition:.25s}
.buffs{background:#020617;border-radius:9px;padding:5px;font-size:11px;color:#bae6fd;min-height:24px}
.timer{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:900}
.timer-wrap{flex:1;height:8px;background:#020617;border-radius:999px;overflow:hidden}
.timer-bar{height:100%;width:100%;background:#38bdf8}
.board-wrap{background:#1f2937;border-radius:16px;padding:5px;flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.board{width:100%;height:auto;max-height:100%;aspect-ratio:6/5;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:4px}
.orb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(21px,8vw,34px);font-weight:900;transition:.07s}
.orb.held{opacity:.15;transform:scale(.9)}
.drag-orb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,36px);font-weight:900;pointer-events:none;z-index:100;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.float{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;pointer-events:none;animation:floatUp 1.6s forwards;text-shadow:0 2px 4px #000;z-index:50;white-space:nowrap}
.member .float{font-size:14px}.damage{color:#ffe066}.hurt{color:#ff7b7b}.healNum{color:#5dff9d}
@keyframes floatUp{20%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-145%) scale(1)}}
.combo-effect{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fff3ad;text-shadow:0 0 12px #facc15,0 0 24px #f59e0b,0 4px 10px #000;pointer-events:none;z-index:9999;animation:comboAnim .9s forwards}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}}
.fire,.fire-bg{background:radial-gradient(circle at 30% 30%,#ffd4a8,#ef4444)}
.water,.water-bg{background:radial-gradient(circle at 30% 30%,#d7f1ff,#3b82f6)}
.wood,.wood-bg{background:radial-gradient(circle at 30% 30%,#e4ffd8,#22c55e)}
.light,.light-bg{background:radial-gradient(circle at 30% 30%,#fffad1,#facc15);color:#111827}
.dark,.dark-bg{background:radial-gradient(circle at 30% 30%,#f5d0fe,#9333ea)}
.none,.none-bg{background:radial-gradient(circle at 30% 30%,#eee,#64748b)}
.heart{background:radial-gradient(circle at 30% 30%,#ffe4f0,#ec4899)}
.attr-fire{color:#ff8a8a;font-weight:900}.attr-water{color:#8ecbff;font-weight:900}.attr-wood{color:#8dff9c;font-weight:900}.attr-light{color:#fff083;font-weight:900}.attr-dark{color:#d8a0ff;font-weight:900}.attr-none{color:#ddd;font-weight:900}
.border-fire{border-color:#ef4444!important}.border-water{border-color:#3b82f6!important}.border-wood{border-color:#22c55e!important}.border-light{border-color:#facc15!important}.border-dark{border-color:#9333ea!important}.border-none{border-color:#94a3b8!important}
.result-box{background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.result-title{text-align:center;font-size:26px;font-weight:900;color:#fff3ad}
.result-item{background:#020617;border-radius:12px;padding:10px;font-size:15px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:99999;padding:18px}
.modal.active{display:flex}
.modal-box{width:100%;max-width:390px;background:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.modal-title{font-size:20px;font-weight:900;color:#fff3ad}
.modal-text{font-size:13px;line-height:1.55;color:#e5e7eb;white-space:pre-wrap;max-height:55svh;overflow:auto}
.modal-list{display:flex;flex-direction:column;gap:6px;max-height:55svh;overflow:auto}
.modal-char-btn{background:#1e293b;color:#fff;text-align:left;font-size:13px;padding:8px;border-radius:10px;border:2px solid transparent}
.gacha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gacha-card{background:#1e293b;border-radius:9px;padding:6px;text-align:center;font-size:11px;border:2px solid transparent}
.gacha-card .icon{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;margin-bottom:2px}
.gacha-card .icon-img{margin-bottom:2px}
.rare6{outline:2px solid #facc15}.rare5{outline:2px solid #c084fc}
</style>
</head>
<body>
<div class="game">

<section id="home" class="screen active">
  <div class="title">パズルRPG</div>
  <div class="status" id="homeStatus"></div>
  <div class="menu">
    <button onclick="showScreen('dungeonMenu')">ダンジョン</button>
    <button onclick="showScreen('charMenu')">キャラ</button>
    <button onclick="showScreen('gacha')">ガチャ</button>
  </div>
</section>

<section id="dungeonMenu" class="screen">
  <div class="title">ダンジョン</div>
  <div class="status" id="dungeonStatus"></div>
  <div class="menu">
    <button onclick="startDungeon('normal')">ノーマルダンジョン</button>
    <button onclick="startDungeon('skill')">スキル強化ダンジョン</button>
    <button onclick="startDungeon('awake')">覚醒ダンジョン</button>
    <button onclick="startDungeon('special')">特殊ダンジョン</button>
    <button onclick="showScreen('home')">戻る</button>
  </div>
</section>

<section id="charMenu" class="screen">
  <div class="title">キャラ</div>
  <div class="row">
    <button onclick="showScreen('home')">戻る</button>
    <button onclick="showScreen('formation')">編成</button>
  </div>
  <select id="sortSelect" onchange="renderCharList()">
    <option value="no">No順</option>
    <option value="rarity">レア度順</option>
    <option value="attr">属性順</option>
    <option value="hp">HP順</option>
    <option value="atk">攻撃順</option>
    <option value="rcv">回復順</option>
    <option value="lv">Lv順</option>
  </select>
  <div class="list" id="charList"></div>
</section>

<section id="formation" class="screen">
  <div class="title">編成</div>
  <button onclick="showScreen('charMenu')">戻る</button>
  <div class="status">左端がリーダー、右端がフレンド。上の枠を押してから下のキャラを選ぶ。</div>
  <div class="party" id="formationSlots"></div>
  <select id="formationSortSelect" onchange="renderFormation()">
    <option value="no">No順</option>
    <option value="rarity">レア度順</option>
    <option value="attr">属性順</option>
    <option value="hp">HP順</option>
    <option value="atk">攻撃順</option>
    <option value="rcv">回復順</option>
    <option value="lv">Lv順</option>
  </select>
  <div class="list" id="formationList"></div>
</section>

<section id="gacha" class="screen">
  <div class="title">ガチャ</div>
  <div class="status">石5個で1回 / 50個で10連<br>★2:40% ★3:38% ★4:15% ★5:5% ★6:2%<br>ガチャ石：<span id="gachaStoneText">0</span></div>
  <button onclick="showGachaInfo()">排出率・排出キャラ一覧</button>
  <div class="row">
    <button onclick="doGacha(1)">1回</button>
    <button onclick="doGacha(10)">10連</button>
  </div>
  <div class="list" id="gachaResult"></div>
  <button onclick="showScreen('home')">戻る</button>
</section>

<section id="result" class="screen">
  <div class="result-box">
    <div class="result-title">ダンジョンクリア！</div>
    <div class="result-item" id="resultSummary"></div>
    <div class="menu">
      <button onclick="showScreen('home')">ホームへ</button>
      <button onclick="showScreen('dungeonMenu')">ダンジョンへ</button>
    </div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="card" style="position:relative">
    <button class="top-retreat" onclick="retreatDungeon()">撤退</button>
    <div class="enemy-area">
      <div class="enemy wood-bg" id="enemyIcon"></div>
      <div class="enemy-info">
        <div class="enemy-name" id="enemyName">モリスライム</div>
        <div>階層：<span id="floorText">1</span>/5 / 攻撃：<span id="enemyAtkText">850</span></div>
        <div class="hp-wrap"><div class="enemy-hp-bar" id="enemyHpBar"></div></div>
        <div>敵HP：<span id="enemyHpText">5000</span>/<span id="enemyMaxHpText">5000</span></div>
        <div class="gimmick" id="gimmickText"></div>
      </div>
    </div>
  </div>

  <div class="message" id="message">ドロップを動かしたら操作開始</div>
  <div class="party" id="party"></div>

  <div class="player" id="playerArea">
    <div class="hp-text"><span>味方HP</span><span><span id="playerHpText">0</span>/<span id="playerMaxHpText">0</span></span></div>
    <div class="player-hp-bar"><div class="player-hp-inner" id="playerHpBar"></div></div>
  </div>

  <div class="buffs" id="buffText">効果なし</div>

  <div class="timer">
    <span>操作 <span id="timerText">5.0</span>秒</span>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  </div>

  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
</section>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <div class="row" id="modalButtons"></div>
  </div>
</div>

<script>
if(location.search.includes("reset=1")){
  localStorage.removeItem("puzzleStableSave3");
  location.href=location.pathname;
}

const ROWS=5,COLS=6,BASE_MOVE_TIME=5;
const TYPES=["fire","water","wood","light","dark","heart"];
const ICONS={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"♡"};
const JP={fire:"火",water:"水",wood:"木",light:"光",dark:"闇",heart:"回復",none:"無"};
const BG={fire:"fire-bg",water:"water-bg",wood:"wood-bg",light:"light-bg",dark:"dark-bg",none:"none-bg"};
const $=id=>document.getElementById(id);
const noSkill={name:"なし",desc:"スキルなし",kind:"none",baseTurn:0};

function char(no,name,rarity,attr,hp,atk,rcv,skill=noSkill,ls="なし"){
  return {no,name,rarity,attr,hp,atk,rcv,type:"battle",lv:1,skillLv:1,skill,ls};
}

const sk={
 convert:(name,from,to,baseTurn=6)=>({name,desc:`${JP[from]}を${JP[to]}ドロップに変換`,kind:"convert",from,to,baseTurn}),
 gen:(to,count,baseTurn=7)=>({name:`${JP[to]}${count}個生成`,desc:`ランダムで${JP[to]}ドロップを${count}個生成`,kind:"generate",to,count,baseTurn}),
 row:(row,to,name,baseTurn=8)=>({name,desc:`横1列を${JP[to]}ドロップに変換`,kind:"row",row,to,baseTurn}),
 col:(col,to,name,baseTurn=8)=>({name,desc:`縦1列を${JP[to]}ドロップに変換`,kind:"col",col,to,baseTurn}),
 board:(name,types,baseTurn=10)=>({name,desc:`全ドロップを${types.map(t=>JP[t]).join("、")}に変換`,kind:"board",types,baseTurn}),
 buffAtk:(m,baseTurn=7)=>({name:`攻撃${m}倍`,desc:`1ターン全属性の攻撃力${m}倍`,kind:"buffAtk",mult:m,baseTurn}),
 buffRcv:(m,baseTurn=7)=>({name:`回復${m}倍`,desc:`1ターン全属性の回復力${m}倍`,kind:"buffRcv",mult:m,baseTurn}),
 buffAttrAtk:(a,m,baseTurn=6)=>({name:`${JP[a]}攻撃${m}倍`,desc:`1ターン${JP[a]}属性の攻撃力${m}倍`,kind:"buffAttrAtk",attr:a,mult:m,baseTurn}),
 buffAttrRcv:(a,m,baseTurn=6)=>({name:`${JP[a]}回復${m}倍`,desc:`1ターン${JP[a]}属性の回復力${m}倍`,kind:"buffAttrRcv",attr:a,mult:m,baseTurn}),
 shield:(r,baseTurn=8)=>({name:`${Math.round(r*100)}%軽減`,desc:`1ターンダメージを${Math.round(r*100)}%軽減`,kind:"shield",rate:r,baseTurn}),
 move:(p,baseTurn=6)=>({name:`操作+${p}秒`,desc:`1ターン操作時間を${p}秒延長`,kind:"move",plus:p,baseTurn}),
 atkCombo:(m,a,baseTurn=8)=>({name:`攻撃${m}倍+${a}コンボ`,desc:`1ターン${a}コンボ加算、攻撃力${m}倍`,kind:"atkCombo",mult:m,add:a,baseTurn}),
 atkRcv:(m,baseTurn=7)=>({name:`攻撃回復${m}倍`,desc:`1ターン攻撃力と回復力${m}倍`,kind:"atkRcv",mult:m,baseTurn})
};

const baseChars=[
 char(1,"火の見習い",1,"fire",500,150,15,noSkill,"4コンボ以上で攻撃上昇、最大3倍"),
 char(2,"水の守り手",1,"water",1500,50,45),
 char(3,"木の兵士",1,"wood",1000,100,30),
 char(4,"闇の爪",1,"dark",750,180,0),
 char(5,"光の癒し手",1,"light",1200,100,50),
 char(6,"火の助っ人",1,"fire",600,130,25,noSkill,"7コンボ以上で攻撃力5倍")
];

const gachaChars=[
 char(19,"炎剣士",3,"fire",1100,320,60,sk.convert("光→火変換","light","fire",6),"火属性の攻撃力1.5倍"),
 char(20,"アクアメイジ",3,"water",2100,180,220,sk.convert("闇→水変換","dark","water",6),"水属性のHP1.5倍"),
 char(21,"森忍者",3,"wood",1800,230,140,sk.convert("火→木変換","fire","wood",6),"木属性の回復力1.5倍"),
 char(22,"聖騎士",3,"light",2000,250,210,sk.convert("水→光変換","water","light",6),"光属性のHPと回復力1.2倍"),
 char(23,"ダークシャーマン",3,"dark",1600,420,20,sk.convert("木→闇変換","wood","dark",6),"闇属性の攻撃力2倍"),
 char(24,"火精霊",3,"fire",1200,300,90,sk.buffAttrAtk("fire",1.5,6),"火属性のHP1.2倍"),
 char(25,"水精霊",3,"water",2400,170,260,sk.buffAttrRcv("water",1.5,6),"水属性の回復力2倍"),
 char(26,"時魔導士",4,"light",2500,320,260,sk.move(1,6),"5コンボ以上で攻撃力上昇、最大5倍"),
 char(27,"戦神兵",4,"fire",1900,520,80,sk.buffAtk(1.5,7),"火属性の攻撃力2倍"),
 char(28,"癒し巫女",4,"water",2900,220,340,sk.buffRcv(1.5,7),"水属性のHPと回復力1.5倍"),
 char(29,"火竜",4,"fire",1700,580,40,sk.gen("fire",3,6),"火属性の攻撃力2倍"),
 char(30,"氷龍",4,"water",3200,260,260,sk.gen("water",3,6),"水属性のHP2倍"),
 char(31,"森龍",4,"wood",2800,310,190,sk.gen("wood",3,6),"木属性の攻撃と回復1.5倍"),
 char(32,"雷帝",4,"light",2600,390,250,sk.col(5,"light","右列光変換",8),"光属性の攻撃力2倍"),
 char(33,"冥騎士",4,"dark",2100,700,0,sk.col(0,"dark","左列闇変換",8),"闇属性の攻撃力2.5倍"),
 char(34,"森姫",4,"wood",3100,280,240,sk.row(2,"wood","中央横木変換",8),"木属性HP1.5倍、回復1.5倍"),
 char(35,"爆炎王",4,"fire",1800,740,30,sk.row(0,"fire","上横火変換",8),"火属性攻撃3倍"),
 char(36,"海王",4,"water",3500,240,300,sk.row(4,"water","下横水変換",8),"水属性HP2倍、攻撃1.5倍"),
 char(37,"フェニックス",5,"fire",2600,980,140,sk.shield(.25,8),"火属性HP1.3倍、攻撃と回復1.5倍"),
 char(38,"三界龍",5,"wood",4200,620,220,sk.board("三色陣",["fire","water","wood"],10),"5コンボ以上で攻撃上昇、最大7倍、操作時間1秒延長"),
 char(39,"聖魔神",5,"dark",3000,1250,40,sk.board("聖魔陣",["dark","light","heart"],10),"闇/光同時消しで25%軽減、攻撃2.5倍、2コンボ加算"),
 char(40,"光神騎士",5,"light",3900,760,330,sk.atkCombo(1.3,1,8),"光属性HP1.3倍、攻撃と回復1.5倍"),
 char(41,"水巫女",5,"water",4700,510,520,sk.atkRcv(1.2,7),"水/木同時消しで15%軽減、攻撃4倍"),
 char(42,"創世龍",6,"light",5200,980,520,sk.board("6色陣",["fire","water","wood","dark","light","heart"],12),"全属性HP1.8倍、攻撃力3倍、回復力2倍、1コンボ加算"),

function sortArray(arr,selectId){

  const order={fire:1,water:2,wood:3,light:4,dark:5,none:6};
  arr.sort((a,b)=>{
    if(s==="rarity")return (b.rarity||0)-(a.rarity||0)||a.no-b.no;
    if(s==="attr")return (order[a.attr]||9)-(order[b.attr]||9)||a.no-b.no;
    if(s==="hp")return stat(b,"hp")-stat(a,"hp");
    if(s==="atk")return stat(b,"atk")-stat(a,"atk");
    if(s==="rcv")return stat(b,"rcv")-stat(a,"rcv");
    if(s==="lv")return (b.lv||1)-(a.lv||1);

  });

}

function useSkill(c){
  const s=c.skill;
  if(!s||s.kind==="none")return modal("スキルなし","このキャラはスキルを持っていません",[{label:"OK"}]);
  if((skillCds[c.no]||0)>0)return modal("まだ使えない",`あと${skillCds[c.no]}ターン必要です`,[{label:"OK"}]);
  if(s.kind==="convert"){for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(board[r][col]===s.from)board[r][col]=s.to;renderBoard();}
  else if(s.kind==="generate"){let spots=[];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)spots.push([r,col]);for(let i=0;i<s.count&&spots.length;i++){let idx=Math.floor(Math.random()*spots.length);let [r,col]=spots.splice(idx,1)[0];board[r][col]=s.to;}renderBoard();}
  else if(s.kind==="row"){for(let col=0;col<COLS;col++)board[s.row][col]=s.to;renderBoard();}
  else if(s.kind==="col"){for(let r=0;r<ROWS;r++)board[r][s.col]=s.to;renderBoard();}
  else if(s.kind==="board"){for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)board[r][col]=s.types[Math.floor(Math.random()*s.types.length)];renderBoard();}
  else if(s.kind==="buffAtk")addBuff({kind:"atk",mult:s.mult,label:`攻撃${s.mult}倍`});
  else if(s.kind==="buffRcv")addBuff({kind:"rcv",mult:s.mult,label:`回復${s.mult}倍`});
  else if(s.kind==="buffAttrAtk")addBuff({kind:"attrAtk",attr:s.attr,mult:s.mult,label:`${JP[s.attr]}攻撃${s.mult}倍`});
  else if(s.kind==="buffAttrRcv")addBuff({kind:"attrRcv",attr:s.attr,mult:s.mult,label:`${JP[s.attr]}回復${s.mult}倍`});
  else if(s.kind==="shield")addBuff({kind:"shield",rate:s.rate,label:`軽減${Math.round(s.rate*100)}%`});
  else if(s.kind==="move")addBuff({kind:"move",plus:s.plus,label:`操作+${s.plus}秒`});
  else if(s.kind==="atkCombo")addBuff({kind:"atkCombo",mult:s.mult,add:s.add,label:`攻撃${s.mult}倍+${s.add}コンボ`});
  else if(s.kind==="atkRcv")addBuff({kind:"atkRcv",mult:s.mult,label:`攻撃回復${s.mult}倍`});

}

    floors=[
      {name:"コンボ吸収スライム",attr:"dark",hp:10000,atk:1200,gimmick:{comboAbsorb:Math.min(7,3+Math.floor(lv/5))}},
      {name:"軽減ゴーレム",attr:"light",hp:15000,atk:1500,gimmick:{reduce:Math.min(.6,.2+lv*.015)}},
      {name:"高火力ドラゴン",attr:"fire",hp:12000,atk:2300,gimmick:{}},
      {name:"闇光吸収ナイト",attr:"dark",hp:18000,atk:1800,gimmick:{attrReduce:{dark:.5,light:.5}}},
      {name:"特殊ボス",attr:"water",hp:26000,atk:2600,gimmick:{comboAbsorb:Math.min(8,4+Math.floor(lv/4)),reduce:Math.min(.5,.15+lv*.01)}}
    ].map(e=>scaleEnemy(e,lv,true));
  }
  playerHp=playerMaxHp;
  setEnemy();
  createBoard();
  showScreen("battle");
  message.textContent=`${type==="special"?"特殊":type==="normal"?"ノーマル":"素材"} Lv${currentLevel} 開始！`;
}
function setEnemy(){
  const e=floors[floorIndex];
  enemyMaxHp=e.hp;enemyHp=e.hp;enemyAtk=e.atk;
  $("enemyName").textContent=e.name;
  $("enemyIcon").className="enemy "+BG[e.attr];
  $("floorText").textContent=floorIndex+1;
  $("enemyAtkText").textContent=enemyAtk;
  $("gimmickText").innerHTML=gimmickLines(e).length?"ギミック<br>・"+gimmickLines(e).join("<br>・"):"ギミックなし";
  updateHp();
}
function updateHp(){
  $("enemyHpText").textContent=enemyHp;$("enemyMaxHpText").textContent=enemyMaxHp;$("enemyHpBar").style.width=(enemyHp/enemyMaxHp*100)+"%";
  $("playerHpText").textContent=playerHp;$("playerMaxHpText").textContent=playerMaxHp;$("playerHpBar").style.width=(playerHp/playerMaxHp*100)+"%";
}
function retreatDungeon(){showScreen("dungeonMenu")}
function createBoard(){
  board=[];
  for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push(TYPES[Math.floor(Math.random()*TYPES.length)]);board.push(row)}
  renderBoard();
}
function renderBoard(){
  boardEl.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=document.createElement("div");o.className="orb "+board[r][c];o.textContent=ICONS[board[r][c]];if(selected&&selected.r===r&&selected.c===c&&dragging)o.classList.add("held");boardEl.appendChild(o)}
}
function getCell(x,y){
  const rect=boardEl.getBoundingClientRect();
  const c=Math.floor((x-rect.left)/(rect.width/COLS)), r=Math.floor((y-rect.top)/(rect.height/ROWS));
  if(r<0||c<0||r>=ROWS||c>=COLS)return null; return{r,c};
}
function swap(a,b){const t=board[a.r][a.c];board[a.r][a.c]=board[b.r][b.c];board[b.r][b.c]=t}
function near(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function createGhost(type,x,y){
  removeGhost();const rect=boardEl.getBoundingClientRect();const size=Math.min(rect.width/COLS-4,rect.height/ROWS-4);
  dragGhost=document.createElement("div");dragGhost.className="drag-orb "+type;dragGhost.textContent=ICONS[type];dragGhost.style.width=size+"px";dragGhost.style.height=size+"px";boardWrap.appendChild(dragGhost);moveGhost(x,y);
}
function moveGhost(x,y){if(!dragGhost)return;const rect=boardWrap.getBoundingClientRect();dragGhost.style.left=(x-rect.left)+"px";dragGhost.style.top=(y-rect.top)+"px"}
function removeGhost(){if(dragGhost){dragGhost.remove();dragGhost=null}}
function moveTime(){return BASE_MOVE_TIME+activeBuffs.filter(b=>b.kind==="move").reduce((s,b)=>s+b.plus,0)}
function startTimer(){
  clearInterval(timerId);const mt=moveTime();const start=performance.now();
  timerId=setInterval(()=>{const left=Math.max(0,mt-(performance.now()-start)/1000);$("timerText").textContent=left.toFixed(1);$("timerBar").style.width=(left/mt*100)+"%";if(left<=0)endDrag()},50);
}
function startDrag(e){
  e.preventDefault();if(resolving||enemyHp<=0||playerHp<=0)return;
  const cell=getCell(e.clientX,e.clientY);if(!cell)return;
  dragging=true;movedOnce=false;selected=cell;createGhost(board[cell.r][cell.c],e.clientX,e.clientY);renderBoard();
}
function moveStep(next){
  if(!selected||!next)return false;if(next.r<0||next.c<0||next.r>=ROWS||next.c>=COLS)return false;if(!near(selected,next))return false;
  if(!movedOnce){movedOnce=true;startTimer();message.textContent="操作中…"}
  swap(selected,next);selected=next;return true;
}
function moveDrag(e){
  e.preventDefault();if(!dragging||!selected)return;moveGhost(e.clientX,e.clientY);
  const cell=getCell(e.clientX,e.clientY);if(!cell||cell.r===selected.r&&cell.c===selected.c)return;
  const dr=cell.r-selected.r,dc=cell.c-selected.c,sr=Math.sign(dr),sc=Math.sign(dc);let changed=false;
  if(Math.abs(dr)>0&&Math.abs(dc)>0){
    if(Math.abs(dc)>=Math.abs(dr)){if(sc)changed=moveStep({r:selected.r,c:selected.c+sc})||changed;if(sr)changed=moveStep({r:selected.r+sr,c:selected.c})||changed}
    else{if(sr)changed=moveStep({r:selected.r+sr,c:selected.c})||changed;if(sc)changed=moveStep({r:selected.r,c:selected.c+sc})||changed}
  }else{if(sr)changed=moveStep({r:selected.r+sr,c:selected.c})||changed;if(sc)changed=moveStep({r:selected.r,c:selected.c+sc})||changed}
  if(changed)renderBoard();
}
function endDrag(e){
  if(e)e.preventDefault();if(!dragging)return;
  dragging=false;selected=null;clearInterval(timerId);removeGhost();renderBoard();if(movedOnce)resolveBoard();
}
function getMatches(){
  const mark={};
  for(let r=0;r<ROWS;r++){let count=1;for(let c=1;c<=COLS;c++){if(c<COLS&&board[r][c]&&board[r][c]===board[r][c-1])count++;else{if(count>=3)for(let k=0;k<count;k++)mark[r+","+(c-1-k)]=true;count=1}}}
  for(let c=0;c<COLS;c++){let count=1;for(let r=1;r<=ROWS;r++){if(r<ROWS&&board[r][c]&&board[r][c]===board[r-1][c])count++;else{if(count>=3)for(let k=0;k<count;k++)mark[(r-1-k)+","+c]=true;count=1}}}
  return mark;
}
function getGroups(){
  const matched=getMatches(),visited={},groups=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  Object.keys(matched).forEach(key=>{
    if(visited[key])return;const [sr,sc]=key.split(",").map(Number);const type=board[sr][sc];const stack=[{r:sr,c:sc}],cells=[];visited[key]=true;
    while(stack.length){const cur=stack.pop();cells.push(cur);dirs.forEach(([dr,dc])=>{const nr=cur.r+dr,nc=cur.c+dc,nk=nr+","+nc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS||!matched[nk]||visited[nk]||board[nr][nc]!==type)return;visited[nk]=true;stack.push({r:nr,c:nc})})}
    groups.push({type,cells,count:cells.length});
  });
  return groups;
}
function showCombo(n){const e=document.createElement("div");e.className="combo-effect";e.textContent=n+"コンボ！";document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
async function resolveBoard(){
  resolving=true;let combo=0;
  while(true){
    const groups=getGroups();if(!groups.length)break;
    for(const g of groups){combo++;showCombo(combo);g.cells.forEach(cell=>board[cell.r][cell.c]=null);renderBoard();await sleep(250)}
    dropOrbs();renderBoard();await sleep(250);
  }
  if(combo>0)attack(combo);else enemyAttack();
  activeBuffs=[];updateBuffText();advanceSkillTurns();resolving=false;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function dropOrbs(){
  for(let c=0;c<COLS;c++){const remain=[];for(let r=ROWS-1;r>=0;r--)if(board[r][c])remain.push(board[r][c]);while(remain.length<ROWS)remain.push(TYPES[Math.floor(Math.random()*TYPES.length)]);for(let r=ROWS-1;r>=0;r--)board[r][c]=remain[ROWS-1-r]}
}
function pop(target,text,cls){const d=document.createElement("div");d.className="float "+cls;d.textContent=text;target.appendChild(d);setTimeout(()=>d.remove(),1600)}
function attack(combo){
  const e=floors[floorIndex], g=e.gimmick||{};
  if(g.comboAbsorb&&combo<=g.comboAbsorb){message.textContent=`${combo}コンボ！ 敵が攻撃を吸収した！`;enemyAttack();return;}
  const atk=party.reduce((s,c)=>s+stat(c,"atk"),0);
  let leaderBonus=1;const lsText=(party[0]?.ls||"")+" "+(party[5]?.ls||"");
  if(lsText.includes("攻撃力3倍"))leaderBonus*=3;if(lsText.includes("攻撃力5倍")&&combo>=7)leaderBonus*=5;if(lsText.includes("最大9倍")&&combo>=6)leaderBonus*=9;if(lsText.includes("最大7倍")&&combo>=5)leaderBonus*=7;
  if(leaderBonus===1){if(combo>=4)leaderBonus*=1.5;if(combo>=7)leaderBonus*=1.5}
  let buff=1;activeBuffs.forEach(b=>{if(b.kind==="atk"||b.kind==="atkCombo"||b.kind==="atkRcv")buff*=b.mult});
  let addCombo=activeBuffs.reduce((s,b)=>s+(b.kind==="atkCombo"?b.add:0),0);
  const finalCombo=combo+addCombo;
  let dmg=Math.floor(atk*(1+(finalCombo-1)*0.25)*leaderBonus*buff);
  if(g.reduce)dmg=Math.floor(dmg*(1-g.reduce));
  enemyHp=Math.max(0,enemyHp-dmg);pop($("enemyIcon"),dmg,"damage");updateHp();message.textContent=finalCombo+"コンボ！ "+dmg+"ダメージ！";
  if(enemyHp<=0)setTimeout(nextFloor,800);else enemyAttack();
}
function enemyAttack(){
  let shield=0;activeBuffs.forEach(b=>{if(b.kind==="shield")shield=1-(1-shield)*(1-b.rate)});
  let dmg=Math.floor(enemyAtk*(1-shield));playerHp=Math.max(0,playerHp-dmg);pop($("playerArea"),"-"+dmg,"hurt");updateHp();
  if(playerHp<=0)message.textContent="ゲームオーバー…";else message.textContent+=" / 敵の攻撃！";
}
function nextFloor(){
  const e=floors[floorIndex];if(e.drop)tempDrops.push(e.drop);if(Math.random()<0.35)tempStone++;
  if(floorIndex>=4){
    const gold=currentDungeon==="normal"?1000+currentLevel*150:currentDungeon==="special"?1400+currentLevel*220:700;
    const stone=(currentDungeon==="normal"?20:currentDungeon==="special"?25:10)+tempStone;
    save.money+=gold;save.stone+=stone;tempDrops.forEach(addOwned);
    if(currentDungeon==="normal")save.clearedNormal=Math.max(save.clearedNormal,currentLevel);
    if(currentDungeon==="special")save.clearedSpecial=Math.max(save.clearedSpecial,currentLevel);
    saveData();
    $("resultSummary").innerHTML=`獲得ゴールド：+${gold}<br>獲得ガチャ石：+${stone}<br>獲得キャラ：${tempDrops.length}体<br>クリア：${currentDungeon==="special"?"特殊":currentDungeon==="normal"?"ノーマル":"素材"} Lv${currentLevel}`;
    showScreen("result");
  }else{floorIndex++;setEnemy();message.textContent="次の階層へ！"}
}
function modal(title,html,buttons){
  $("modalTitle").textContent=title;$("modalText").innerHTML=html;const b=$("modalButtons");b.innerHTML="";
  buttons.forEach(x=>{const btn=document.createElement("button");btn.textContent=x.label;btn.onclick=()=>{closeModal();x.fn&&x.fn()};b.appendChild(btn)});
  $("modal").classList.add("active");
}
function closeModal(){$("modal").classList.remove("active")}
boardEl.addEventListener("pointerdown",startDrag);
window.addEventListener("pointermove",moveDrag);
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
updateHome();
</script>
</body>
